<!doctype html>

<html>
    <head>
        <style>
            :root {
                --bg: rgba(250, 250, 250, 0.98);

                --text-primary: #1d1d1f;

                --text-secondary: #5b5b5f;

                --separator: rgba(0, 0, 0, 0.12);

                --accent: #007aff;

                --danger: #d70015;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: rgba(30, 30, 32, 0.98);

                    --text-primary: #f5f5f7;

                    --text-secondary: #b0b0b5;

                    --separator: rgba(255, 255, 255, 0.16);

                    --accent: #0a84ff;

                    --danger: #ff6961;
                }
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;

                height: 100%;

                overflow: hidden;
            }

            body {
                display: flex;

                flex-direction: column;

                background: var(--bg);

                color: var(--text-primary);

                font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;

                -webkit-font-smoothing: antialiased;

                user-select: none;

                border-radius: 10px;

                cursor: default;
            }

            #original {
                flex: none;

                padding: 10px 12px 9px;

                font-size: 13px;

                font-weight: 500;

                color: var(--text-secondary);

                border-bottom: 1px solid var(--separator);

                max-height: 54px;

                overflow-y: auto;
            }

            #translated-wrap {
                flex: 1;

                padding: 9px 12px 11px;

                overflow-y: auto;

                display: flex;

                flex-direction: column;

                gap: 5px;
            }

            #translated {
                font-size: 15.5px;

                font-weight: 500;

                color: var(--text-primary);

                line-height: 1.35;
            }

            #translated.error {
                color: var(--danger);

                font-size: 12.5px;

                font-weight: 500;
            }

            #detected {
                font-size: 10.5px;

                font-weight: 600;

                color: var(--text-secondary);

                text-transform: uppercase;

                letter-spacing: 0.02em;
            }

            .dot {
                display: inline-block;

                width: 5px;

                height: 5px;

                border-radius: 50%;

                background: var(--text-secondary);

                animation: pulse 1s infinite ease-in-out;
            }

            @keyframes pulse {
                0%,
                80%,
                100% {
                    opacity: 0.3;
                }

                40% {
                    opacity: 1;
                }
            }
        </style>
    </head>

    <body>
        <div id="original"></div>

        <div id="translated-wrap">
            <div id="translated"><span class="dot"></span></div>

            <div id="detected"></div>
        </div>

        <script>
            const originalEl = document.getElementById('original');

            const translatedEl = document.getElementById('translated');

            const detectedEl = document.getElementById('detected');

            browserAPI.onSelectionInit((payload) => {
                originalEl.textContent = payload.text;
            });

            browserAPI.onSelectionResult((payload) => {
                if (payload.ok) {
                    translatedEl.classList.remove('error');

                    translatedEl.textContent = payload.translated;

                    detectedEl.textContent = payload.detectedLangName
                        ? 'From ' + payload.detectedLangName
                        : '';
                } else {
                    translatedEl.classList.add('error');

                    translatedEl.textContent = payload.error || 'Translation failed';

                    detectedEl.textContent = '';
                }
            });

            /*
                Any subsequent mouse or keyboard input dismisses this
                popup — it is a transient answer to one right-click, not
                a panel meant to be interacted with further
            */

            window.addEventListener('keydown', () => window.close());

            window.addEventListener('mousedown', () => window.close());
        </script>
    </body>
</html>
