<!doctype html>

<html>
    <head>
        <style>
            /*
                macOS system-like tokens. Defined once for light mode and
                overridden for dark, so the chrome follows the OS
                appearance the same way Electron's nativeTheme (default
                source: "system") drives prefers-color-scheme here.
            */

            :root {
                --toolbar-bg: rgba(246, 246, 246, 0.72);

                --text-primary: #1d1d1f;

                --text-secondary: #6e6e73;

                --separator: rgba(0, 0, 0, 0.1);

                --hover: rgba(0, 0, 0, 0.06);

                --active: rgba(0, 0, 0, 0.12);

                --accent: #007aff;

                --danger: #ff3b30;

                --success: #34c759;

                --warning: #ffcc00;

                --field-bg: rgba(255, 255, 255, 0.55);

                --field-bg-focus: rgba(255, 255, 255, 0.9);

                --field-border: rgba(0, 0, 0, 0.12);

                --letter-bg: #8e8e93;

                --letter-fg: #ffffff;

                /*
                    Safari's active tab reads as a raised card sitting on
                    the tab-strip surface, rather than a flat tint
                */

                --tab-active-bg: rgba(255, 255, 255, 0.92);

                --tab-active-shadow:
                    0 1px 4px rgba(0, 0, 0, 0.16),
                    0 0 0 0.5px rgba(0, 0, 0, 0.06);

                /*
                    A shade darker than the toolbar above it, so the
                    bookmarks bar reads as its own shelf rather than an
                    extension of the address bar row
                */

                --bookmark-bar-bg: rgba(229, 229, 231, 0.78);

                --bookmark-bar-border: rgba(0, 0, 0, 0.16);
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --toolbar-bg: rgba(30, 30, 32, 0.55);

                    --text-primary: #f5f5f7;

                    --text-secondary: #98989d;

                    --separator: rgba(255, 255, 255, 0.12);

                    --hover: rgba(255, 255, 255, 0.09);

                    --active: rgba(255, 255, 255, 0.16);

                    --accent: #0a84ff;

                    --danger: #ff453a;

                    --success: #30d158;

                    --warning: #ffd60a;

                    --field-bg: rgba(255, 255, 255, 0.09);

                    --field-bg-focus: rgba(255, 255, 255, 0.16);

                    --field-border: rgba(255, 255, 255, 0.14);

                    --letter-bg: #6e6e73;

                    --letter-fg: #ffffff;

                    --tab-active-bg: rgba(255, 255, 255, 0.14);

                    --tab-active-shadow:
                        0 1px 4px rgba(0, 0, 0, 0.45),
                        0 0 0 0.5px rgba(255, 255, 255, 0.08);

                    --bookmark-bar-bg: rgba(20, 20, 22, 0.62);

                    --bookmark-bar-border: rgba(255, 255, 255, 0.18);
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;

                /*
                    Transparent so the window's own vibrancy material
                    shows through instead of a flat panel
                */

                background: transparent;

                color: var(--text-primary);

                font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;

                -webkit-font-smoothing: antialiased;

                user-select: none;
            }

            svg {
                display: block;

                flex: none;
            }

            /*
                Three columns so the address bar can sit centred in the
                window the way Safari's does, regardless of how wide the
                button clusters on either side of it are
            */

            #bar {
                height: 40px;

                display: grid;

                grid-template-columns: auto 1fr auto;

                align-items: center;

                /*
                    Now the top row, so the left edge leaves room for the
                    traffic lights (custom-positioned at 12,12) the same
                    way the tab strip used to
                */

                padding: 0 8px 0 80px;

                background: var(--toolbar-bg);

                border-bottom: 1px solid var(--separator);

                -webkit-app-region: drag;
            }

            .bar-left,
            .bar-right {
                display: flex;

                align-items: center;

                -webkit-app-region: no-drag;
            }

            .bar-right {
                justify-content: flex-end;
            }

            button {
                width: 30px;

                height: 30px;

                margin-left: 2px;

                border: none;

                border-radius: 6px;

                background: transparent;

                color: var(--text-primary);

                cursor: pointer;

                display: flex;

                align-items: center;

                justify-content: center;

                -webkit-app-region: no-drag;
            }

            button:hover {
                background: var(--hover);
            }

            button:active {
                background: var(--active);
            }

            /*
                A little breathing room ahead of the address bar, so the
                nav buttons read as one cluster
            */

            #reload {
                margin-right: 6px;
            }

            /*
            Address bar.

            The input always holds the real URL. While it is not focused
            an overlay shows the tidied-up form browsers display instead:
            no https://, no www., and the domain emphasised over the path.
        */

            #omnibox {
                position: relative;

                justify-self: center;

                width: 100%;

                max-width: 560px;

                margin: 0 10px;

                height: 28px;

                -webkit-app-region: no-drag;
            }

            #url {
                box-sizing: border-box;

                width: 100%;

                height: 100%;

                margin: 0;

                border-radius: 7px;

                border: 1px solid var(--field-border);

                background: var(--field-bg-focus);

                /*
                Always holds the real URL underneath, but stays invisible
                until focused — otherwise its text (and placeholder) would
                show through the translucent #url-display sitting on top
            */

                color: transparent;

                padding-left: 10px;

                /*
                Room reserved on the right so typed text never runs
                under the search-engine button anchored there
            */

                padding-right: 44px;

                font-family: inherit;

                font-size: 12.5px;

                outline: none;
            }

            #url::placeholder {
                color: transparent;
            }

            #url:focus {
                color: var(--text-primary);

                border-color: var(--accent);

                box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
            }

            #url:focus::placeholder {
                color: var(--text-secondary);
            }

            #url-display {
                position: absolute;

                top: 0;

                left: 0;

                right: 0;

                bottom: 0;

                display: flex;

                align-items: center;

                border-radius: 7px;

                border: 1px solid var(--field-border);

                background: var(--field-bg);

                padding-left: 10px;

                padding-right: 44px;

                font-size: 12.5px;

                white-space: nowrap;

                overflow: hidden;

                cursor: text;
            }

            #url-display:hover {
                background: var(--field-bg-focus);
            }

            /*
                The active tab's favicon, shown ahead of the domain the
                way Safari's address bar does — falls back to a generic
                globe when the page has none
            */

            #url-favicon {
                width: 14px;

                height: 14px;

                flex: none;

                margin-right: 7px;

                border-radius: 3px;

                object-fit: contain;
            }

            #url-display.hidden {
                display: none;
            }

            /*
            The registrable domain is what a browser emphasises,
            so the rest of the URL cannot be used to disguise it
        */

            #url-host {
                color: var(--text-primary);
            }

            #url-scheme,
            #url-rest {
                color: var(--text-secondary);
            }

            /*
            Insecure pages keep a visible http:// rather than hiding it
        */

            #url-scheme.insecure {
                color: var(--danger);
            }

            /*
            Anchored to the address bar's own right edge, on top of the
            field rather than out with the other toolbar buttons, since
            it belongs to what is typed there — the way Chrome shows an
            engine/extension icon inside the omnibox itself
        */

            #search-engine {
                position: absolute;

                top: 2px;

                bottom: 2px;

                right: 2px;

                z-index: 1;

                display: flex;

                align-items: center;

                justify-content: center;

                gap: 3px;

                width: auto;

                min-width: 26px;

                height: auto;

                margin-left: 0;

                padding: 0 6px;

                border-radius: 5px;

                color: var(--text-secondary);

                -webkit-app-region: no-drag;
            }

            #search-engine:hover {
                background: var(--hover);

                color: var(--text-primary);
            }

            #search-engine-icon {
                width: 14px;

                height: 14px;

                border-radius: 3px;

                object-fit: contain;
            }

            /*
            Stands in for an engine whose icon will not load
        */

            #search-engine-icon.letter {
                display: flex;

                align-items: center;

                justify-content: center;

                background: var(--letter-bg);

                color: var(--letter-fg);

                font-size: 9px;

                text-transform: uppercase;
            }

            /*
            Bookmarks
        */

            /*
            Widens to fit the count once a page has had something
            blocked on it
        */

            #shield {
                width: auto;

                min-width: 30px;

                padding: 0 7px;

                gap: 3px;
            }

            #shield .count {
                color: var(--accent);

                font-size: 11px;

                font-variant-numeric: tabular-nums;
            }

            /*
            Dimmed where the user has turned blocking off, the way a
            browser greys out its shield
        */

            #shield.off {
                opacity: 0.4;
            }

            /*
            Briefly acknowledges a click, since the change itself
            happens out of sight
        */

            #set-home.confirmed {
                color: var(--success);
            }

            #bookmark-toggle svg {
                fill: none;

                stroke: currentColor;
            }

            #bookmark-toggle.saved {
                color: var(--warning);
            }

            #bookmark-toggle.saved svg {
                fill: currentColor;
            }

            #bookmark-bar-toggle.on,
            #group-tabs-toggle.on,
            #translate.on {
                background: var(--hover);

                color: var(--accent);
            }

            /*
            Downloads

            Widens for its badge exactly like the shield does, and gets
            an animated nudge while something is actively downloading so
            it is noticeable without needing the panel open
        */

            #downloads {
                position: relative;

                width: auto;

                min-width: 30px;

                padding: 0 7px;

                gap: 3px;
            }

            #downloads .count {
                color: var(--accent);

                font-size: 11px;

                font-variant-numeric: tabular-nums;
            }

            #downloads.active svg {
                animation: downloads-bounce 1.1s ease-in-out infinite;
            }

            @keyframes downloads-bounce {
                0%,
                100% {
                    transform: translateY(0);
                }

                50% {
                    transform: translateY(1.5px);
                }
            }

            /*
            A strip below the address bar, the way desktop browsers show
            bookmarks. Anything past the window width scrolls rather than
            folding into an overflow menu.
        */

            #bookmark-bar {
                position: relative;

                display: none;

                align-items: center;

                /*
                    Centred the way Safari's favorites bar clusters its
                    items around the middle rather than hugging the left
                */

                justify-content: center;

                height: 32px;

                padding: 0 6px;

                border-top: 1px solid var(--bookmark-bar-border);

                border-bottom: 1px solid var(--bookmark-bar-border);

                background: var(--bookmark-bar-bg);

                overflow-x: auto;

                overflow-y: hidden;

                white-space: nowrap;
            }

            #bookmark-bar.visible {
                display: flex;
            }

            #bookmark-bar::-webkit-scrollbar {
                height: 0;
            }

            .bookmark {
                box-sizing: border-box;

                display: flex;

                align-items: center;

                flex: none;

                max-width: 180px;

                height: 24px;

                margin-right: 2px;

                padding: 0 8px;

                border-radius: 6px;

                color: var(--text-primary);

                font-size: 12px;

                cursor: pointer;

                user-select: none;
            }

            .bookmark:hover {
                background: var(--hover);
            }

            .bookmark.dragging {
                opacity: 0.4;
            }

            .bookmark-icon {
                width: 15px;

                height: 15px;

                flex: none;

                margin-right: 6px;

                border-radius: 3px;

                object-fit: contain;
            }

            /*
            Stands in for a site with no usable icon
        */

            .bookmark-letter {
                display: flex;

                align-items: center;

                justify-content: center;

                background: var(--letter-bg);

                color: var(--letter-fg);

                font-size: 10px;

                text-transform: uppercase;
            }

            .bookmark-label {
                overflow: hidden;

                text-overflow: ellipsis;

                white-space: nowrap;
            }

            .bookmark-rename {
                width: 120px;

                height: 18px;

                margin: 0;

                border: 1px solid var(--field-border);

                border-radius: 4px;

                background: var(--field-bg-focus);

                color: var(--text-primary);

                padding: 0 4px;

                font-family: inherit;

                font-size: 12px;
            }

            /*
            Marks where a dragged bookmark would land. Positioned rather
            than inserted, so the chips do not shift under the cursor.
        */

            #bookmark-drop {
                position: absolute;

                top: 5px;

                display: none;

                width: 2px;

                height: 24px;

                border-radius: 1px;

                background: var(--accent);

                pointer-events: none;
            }

            #bookmark-drop.visible {
                display: block;
            }

            #bookmark-empty {
                color: var(--text-secondary);

                font-size: 12px;
            }

            /*
            Save-password prompt shown after a login form is submitted
        */

            #save-password-prompt {
                display: none;

                align-items: center;

                gap: 10px;

                min-height: 36px;

                padding: 6px 12px;

                background: color-mix(in srgb, var(--success) 16%, var(--toolbar-bg));

                border-bottom: 1px solid var(--separator);

                color: var(--text-primary);

                font-size: 13px;
            }

            #save-password-prompt.visible {
                display: flex;
            }

            #save-password-prompt-text {
                flex: 1;

                min-width: 0;

                white-space: nowrap;

                overflow: hidden;

                text-overflow: ellipsis;
            }

            #save-password-prompt-timer {
                color: var(--text-secondary);

                font-size: 12px;

                flex-shrink: 0;
            }

            #save-password-prompt-actions {
                display: flex;

                gap: 6px;

                flex-shrink: 0;
            }

            #save-password-prompt-actions button {
                width: auto;

                height: 26px;

                margin-left: 0;

                padding: 0 12px;

                font-size: 12px;

                border-radius: 6px;
            }

            #save-password-save {
                background: var(--accent);

                color: #ffffff;
            }

            #save-password-save:hover {
                filter: brightness(1.1);
            }

            #save-password-dismiss {
                background: var(--hover);
            }

            #save-password-dismiss:hover {
                background: var(--active);
            }

            /*
            Tabs

            Merged with the window's own title bar: the traffic lights
            live inside this row (see trafficLightPosition in
            windowManager.js), so the row itself is a drag handle except
            where a tab or button sits on top of it.

            Shown even when there is only one tab, so the page never
            moves up and down underneath the pointer as tabs come and go.
        */

            #tab-strip {
                display: flex;

                align-items: center;

                height: 40px;

                padding: 0 6px;

                background: var(--toolbar-bg);
            }

            #tabs {
                position: relative;

                display: flex;

                align-items: center;

                flex: 1;

                /*
                Without this the tabs push the "+" off the end of the
                strip rather than shrinking
            */

                min-width: 0;

                height: 100%;

                overflow: hidden;

                -webkit-app-region: no-drag;
            }

            .tab {
                box-sizing: border-box;

                display: flex;

                align-items: center;

                /*
                Shared out evenly, the way a browser divides its strip,
                up to the width one tab is worth showing at
            */

                flex: 1 1 0;

                min-width: 44px;

                max-width: 200px;

                height: 28px;

                margin-right: 2px;

                padding: 0 6px 0 8px;

                border-radius: 8px;

                color: var(--text-secondary);

                font-size: 12px;

                cursor: default;

                user-select: none;

                overflow: hidden;

                transition: background-color 0.1s ease, box-shadow 0.1s ease;
            }

            .tab:hover {
                background: var(--hover);

                color: var(--text-primary);
            }

            /*
                Reads as a raised card sitting on the tab-strip surface,
                the way Safari's selected tab does, rather than a flat
                tint like the hover state
            */

            .tab.active {
                background: var(--tab-active-bg);

                box-shadow: var(--tab-active-shadow);

                color: var(--text-primary);
            }

            .tab.dragging {
                opacity: 0.4;
            }

            /*
                A tab whose renderer has been freed to save memory. Dimmed
                rather than hidden or badged, so the strip still reads
                normally at a glance — it only matters once you notice the
                brief reload the next click on it causes.
            */

            .tab.suspended:not(.active) {
                opacity: 0.55;
            }

            .tab-icon {
                width: 15px;

                height: 15px;

                flex: none;

                margin-right: 6px;

                border-radius: 3px;

                object-fit: contain;
            }

            /*
            Stands in for a site with no usable icon
        */

            .tab-letter {
                display: flex;

                align-items: center;

                justify-content: center;

                background: var(--letter-bg);

                color: var(--letter-fg);

                font-size: 10px;

                text-transform: uppercase;
            }

            /*
            Takes the icon's place while the page is on its way, so a tab
            opened in the background says it is doing something
        */

            .tab-spinner {
                box-sizing: border-box;

                width: 13px;

                height: 13px;

                flex: none;

                margin: 0 7px 0 1px;

                border: 2px solid var(--separator);

                border-top-color: var(--accent);

                border-radius: 50%;

                animation: tab-spin 0.7s linear infinite;
            }

            @keyframes tab-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .tab-label {
                flex: 1;

                overflow: hidden;

                text-overflow: ellipsis;

                white-space: nowrap;
            }

            /*
            Only on the tab being pointed at and the one in front, so a
            full strip is not a row of crosses
        */

            .tab-close {
                display: flex;

                align-items: center;

                justify-content: center;

                flex: none;

                width: 16px;

                height: 16px;

                margin-left: 4px;

                border-radius: 50%;

                color: var(--text-secondary);

                visibility: hidden;
            }

            .tab:hover .tab-close,
            .tab.active .tab-close {
                visibility: visible;
            }

            .tab-close:hover {
                background: var(--active);

                color: var(--text-primary);
            }

            /*
                A count badge on a grouped tab's chip, showing how many
                real tabs it stands in for
            */

            .tab-group-count {
                flex: none;

                display: flex;

                align-items: center;

                justify-content: center;

                height: 15px;

                margin-left: 4px;

                padding: 0 5px;

                border-radius: 7px;

                background: var(--letter-bg);

                color: var(--letter-fg);

                font-size: 10px;
            }

            /*
                The active group's members, shown as a second row under
                the strip — same idea as the bookmark bar, but for the
                tabs a grouped chip is currently standing in for
            */

            #sub-tab-strip {
                display: none;

                align-items: center;

                height: 32px;

                padding: 0 6px;

                border-top: 1px solid var(--separator);

                background: var(--toolbar-bg);

                overflow-x: auto;

                overflow-y: hidden;

                white-space: nowrap;

                -webkit-app-region: no-drag;
            }

            #sub-tab-strip.visible {
                display: flex;
            }

            #sub-tab-strip::-webkit-scrollbar {
                height: 0;
            }

            #sub-tabs {
                display: flex;

                align-items: center;

                min-width: 0;
            }

            #sub-tabs .tab {
                flex: none;

                height: 24px;

                min-width: 90px;

                max-width: 160px;

                font-size: 11.5px;
            }

            /*
            Marks where a dragged tab would land. Positioned rather than
            inserted, so the strip does not shift under the cursor.
        */

            #tab-drop {
                position: absolute;

                top: 4px;

                display: none;

                width: 2px;

                height: 28px;

                border-radius: 1px;

                background: var(--accent);

                pointer-events: none;
            }

            #tab-drop.visible {
                display: block;
            }

            #new-tab {
                flex: none;

                width: 28px;

                height: 28px;

                margin-left: 4px;

                background: transparent;

                color: var(--text-secondary);

                -webkit-app-region: no-drag;
            }

            #new-tab:hover {
                background: var(--hover);

                color: var(--text-primary);
            }

            /*
                Stands in for the native title-attribute tooltip: shows
                sooner and is themed to match the toolbar rather than the
                OS default. Positioned in JS, since it has to stay inside
                the visible toolbar strip — the BrowserView holding the
                actual page sits natively on top of anything below it.
            */

            #tooltip-bubble {
                position: fixed;

                z-index: 9999;

                max-width: 260px;

                padding: 4px 8px;

                border-radius: 6px;

                background: var(--tab-active-bg);

                color: var(--text-primary);

                border: 1px solid var(--field-border);

                box-shadow: var(--tab-active-shadow);

                font-size: 11.5px;

                line-height: 1.35;

                white-space: pre-line;

                pointer-events: none;

                opacity: 0;

                transform: translateY(2px);

                transition: opacity 0.1s ease, transform 0.1s ease;
            }

            #tooltip-bubble.visible {
                opacity: 1;

                transform: translateY(0);
            }
        </style>
    </head>

    <body>
        <div id="bar">
            <div class="bar-left">
                <button onclick="browserAPI.back()" data-tooltip="Back">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg>
                </button>

                <button onclick="browserAPI.forward()" data-tooltip="Forward">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg>
                </button>

                <button id="home" onclick="browserAPI.goHome()" data-tooltip="Home">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5 8 4l5.5 4.5"/><path d="M4 7.3V13h8V7.3"/></svg>
                </button>

                <button id="reload" onclick="browserAPI.reload()" data-tooltip="Reload">
                    <svg viewBox="0 0 16 16" width="14" height="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M13 8A5 5 0 1 1 11.3 4.2"/><path d="M13 3.2v3.6H9.4"/></svg>
                </button>
            </div>

            <div id="omnibox">
                <input id="url" placeholder="Enter website URL" />

                <div id="url-display" class="hidden">
                    <img id="url-favicon" alt="" />
                    <span id="url-scheme"></span><span id="url-host"></span
                    ><span id="url-rest"></span>
                </div>

                <button id="search-engine" data-tooltip="Search Engine"></button>
            </div>

            <div class="bar-right">

                <button id="shield" data-tooltip="Ad Blocker">
                    <span id="shield-icon" class="btn-icon">
                        <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.7 13 3.6v4.1c0 3.4-2.2 5.6-5 6.4-2.8-.8-5-3-5-6.4V3.6l5-1.9Z"/></svg>
                    </span>
                    <span class="count" id="shield-count"></span>

                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2 4.3h12"/><rect x="2.5" y="7.3" width="2.7" height="2.7" rx="0.6" fill="currentColor" stroke="none"/><rect x="6.65" y="7.3" width="2.7" height="2.7" rx="0.6" fill="currentColor" stroke="none"/><rect x="10.8" y="7.3" width="2.7" height="2.7" rx="0.6" fill="currentColor" stroke="none"/></svg>

                <button id="downloads" data-tooltip="Downloads">

                    <span class="count" id="downloads-count"></span>

                <button id="passwords" data-tooltip="Passwords">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.1" cy="10.9" r="2.3"/><path d="M6.8 9.2 13.2 2.8"/><path d="M11.2 4.8l1.5 1.5"/><path d="M9.6 6.4l1.2 1.2"/></svg>

                <button id="new-window" data-tooltip="New Window ⌘N">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 1.6v12.8M1.6 8h12.8"/></svg>

        <div id="save-password-prompt">
            <span id="save-password-prompt-text"></span>

            <span id="save-password-prompt-timer"></span>

            <div id="save-password-prompt-actions">
                <button id="save-password-save" type="button">Save</button>

                <button id="save-password-dismiss" type="button">Not now</button>
            </div>
        </div>

        <div id="bookmark-bar"><div id="bookmark-drop"></div></div>

        <div id="tab-strip">
            <div id="tabs">
                <div id="tab-drop"></div>

                <button id="new-tab" data-tooltip="New Tab ⌘T">
                    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
                </button>
            </div>
