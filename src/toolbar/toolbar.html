<!doctype html>

<html>
    <head>
        <style>
            body {
                margin: 0;

                background: #202124;

                font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            }

            #bar {
                height: 50px;

                display: flex;

                align-items: center;
            }

            button {
                width: 35px;

                height: 30px;

                margin-left: 8px;

                border: none;

                border-radius: 6px;

                background: #303134;

                color: white;

                cursor: pointer;
            }

            button:hover {
                background: #505050;
            }

            /*
            Address bar.

            The input always holds the real URL. While it is not focused
            an overlay shows the tidied-up form browsers display instead:
            no https://, no www., and the domain emphasised over the path.
        */

            #omnibox {
                position: relative;

                flex: 1;

                max-width: 520px;

                margin-left: 10px;

                /*
                Tight, so the engine arrow reads as part of the address
                bar rather than as another toolbar button
            */

                margin-right: 2px;

                height: 28px;
            }

            #url {
                box-sizing: border-box;

                width: 100%;

                height: 100%;

                margin: 0;

                border-radius: 6px;

                border: none;

                padding-left: 10px;

                font-family: inherit;

                font-size: 13px;
            }

            #url-display {
                position: absolute;

                top: 0;

                left: 0;

                right: 0;

                bottom: 0;

                display: flex;

                align-items: center;

                border-radius: 6px;

                background: white;

                padding-left: 10px;

                padding-right: 10px;

                font-size: 13px;

                white-space: nowrap;

                overflow: hidden;

                cursor: text;
            }

            #url-display.hidden {
                display: none;
            }

            /*
            The registrable domain is what a browser emphasises,
            so the rest of the URL cannot be used to disguise it
        */

            #url-host {
                color: #202124;
            }

            #url-scheme,
            #url-rest {
                color: #5f6368;
            }

            /*
            Insecure pages keep a visible http:// rather than hiding it
        */

            #url-scheme.insecure {
                color: #c5221f;
            }

            /*
            Sits against the address bar rather than with the other
            buttons, since it belongs to what is typed there
        */

            #search-engine {
                display: flex;

                align-items: center;

                justify-content: center;

                gap: 3px;

                width: auto;

                min-width: 34px;

                margin-left: 0;

                padding: 0 5px;

                font-size: 9px;

                color: #9aa0a6;
            }

            #search-engine:hover {
                color: white;
            }

            #search-engine-icon {
                width: 14px;

                height: 14px;

                border-radius: 3px;

                object-fit: contain;
            }

            /*
            Stands in for an engine whose icon will not load
        */

            #search-engine-icon.letter {
                display: flex;

                align-items: center;

                justify-content: center;

                background: #5f6368;

                color: #e8eaed;

                font-size: 9px;

                text-transform: uppercase;
            }

            /*
            Focus mode and window controls
        */

            #focus-toggle.on {
                background: #8ab4f8;

                color: #202124;
            }

            /*
            Pushed to the far right, away from the page controls
        */

            #maximise {
                margin-left: auto;

                margin-right: 10px;

                font-size: 13px;
            }

            /*
            Bookmarks
        */

            /*
            Widens to fit the count once a page has had something
            blocked on it
        */

            #shield {
                width: auto;

                min-width: 35px;

                padding: 0 8px;

                font-size: 12px;
            }

            #shield .count {
                margin-left: 4px;

                color: #8ab4f8;

                font-variant-numeric: tabular-nums;
            }

            /*
            Dimmed where the user has turned blocking off, the way a
            browser greys out its shield
        */

            #shield.off {
                opacity: 0.45;
            }

            #set-home {
                font-size: 12px;
            }

            /*
            Briefly acknowledges a click, since the change itself
            happens out of sight
        */

            #set-home.confirmed {
                background: #81c995;

                color: #202124;
            }

            #bookmark-toggle.saved {
                color: #fdd663;
            }

            #bookmark-bar-toggle.on {
                background: #505050;
            }

            /*
            A strip below the address bar, the way desktop browsers show
            bookmarks. Anything past the window width scrolls rather than
            folding into an overflow menu.
        */

            #bookmark-bar {
                position: relative;

                display: none;

                align-items: center;

                height: 34px;

                padding: 0 6px;

                border-top: 1px solid #3c4043;

                background: #292a2d;

                overflow-x: auto;

                overflow-y: hidden;

                white-space: nowrap;
            }

            #bookmark-bar.visible {
                display: flex;
            }

            #bookmark-bar::-webkit-scrollbar {
                height: 0;
            }

            .bookmark {
                box-sizing: border-box;

                display: flex;

                align-items: center;

                flex: none;

                max-width: 180px;

                height: 24px;

                margin-right: 2px;

                padding: 0 8px;

                border-radius: 6px;

                color: #e8eaed;

                font-size: 12px;

                cursor: pointer;

                user-select: none;
            }

            .bookmark:hover {
                background: #3c4043;
            }

            .bookmark.dragging {
                opacity: 0.4;
            }

            .bookmark-icon {
                width: 16px;

                height: 16px;

                flex: none;

                margin-right: 6px;

                border-radius: 3px;

                object-fit: contain;
            }

            /*
            Stands in for a site with no usable icon
        */

            .bookmark-letter {
                display: flex;

                align-items: center;

                justify-content: center;

                background: #5f6368;

                color: #e8eaed;

                font-size: 10px;

                text-transform: uppercase;
            }

            .bookmark-label {
                overflow: hidden;

                text-overflow: ellipsis;

                white-space: nowrap;
            }

            .bookmark-rename {
                width: 120px;

                height: 18px;

                margin: 0;

                border: none;

                border-radius: 3px;

                padding: 0 4px;

                font-family: inherit;

                font-size: 12px;
            }

            /*
            Marks where a dragged bookmark would land. Positioned rather
            than inserted, so the chips do not shift under the cursor.
        */

            #bookmark-drop {
                position: absolute;

                top: 5px;

                display: none;

                width: 2px;

                height: 24px;

                border-radius: 1px;

                background: #8ab4f8;

                pointer-events: none;
            }

            #bookmark-drop.visible {
                display: block;
            }

            #bookmark-empty {
                padding-left: 6px;

                color: #9aa0a6;

                font-size: 12px;
            }

            /*
            Tabs

            A strip above the address bar. It is shown even when there is
            only one tab, so the page never moves up and down underneath
            the pointer as tabs come and go.
        */

            #tab-strip {
                display: flex;

                align-items: center;

                height: 36px;

                padding: 0 6px;

                background: #292a2d;
            }

            #tabs {
                position: relative;

                display: flex;

                align-items: center;

                flex: 1;

                /*
                Without this the tabs push the "+" off the end of the
                strip rather than shrinking
            */

                min-width: 0;

                height: 100%;

                overflow: hidden;
            }

            .tab {
                box-sizing: border-box;

                display: flex;

                align-items: center;

                /*
                Shared out evenly, the way a browser divides its strip,
                up to the width one tab is worth showing at
            */

                flex: 1 1 0;

                min-width: 44px;

                max-width: 200px;

                height: 28px;

                margin-right: 2px;

                padding: 0 6px 0 8px;

                border-radius: 8px;

                color: #9aa0a6;

                font-size: 12px;

                cursor: default;

                user-select: none;

                overflow: hidden;
            }

            .tab:hover {
                background: #35363a;

                color: #e8eaed;
            }

            .tab.active {
                background: #3c4043;

                color: #e8eaed;
            }

            .tab.dragging {
                opacity: 0.4;
            }

            .tab-icon {
                width: 16px;

                height: 16px;

                flex: none;

                margin-right: 6px;

                border-radius: 3px;

                object-fit: contain;
            }

            /*
            Stands in for a site with no usable icon
        */

            .tab-letter {
                display: flex;

                align-items: center;

                justify-content: center;

                background: #5f6368;

                color: #e8eaed;

                font-size: 10px;

                text-transform: uppercase;
            }

            /*
            Takes the icon's place while the page is on its way, so a tab
            opened in the background says it is doing something
        */

            .tab-spinner {
                box-sizing: border-box;

                width: 14px;

                height: 14px;

                flex: none;

                margin: 0 7px 0 1px;

                border: 2px solid #5f6368;

                border-top-color: #8ab4f8;

                border-radius: 50%;

                animation: tab-spin 0.7s linear infinite;
            }

            @keyframes tab-spin {
                to {
                    transform: rotate(360deg);
                }
            }

            .tab-label {
                flex: 1;

                overflow: hidden;

                text-overflow: ellipsis;

                white-space: nowrap;
            }

            /*
            Only on the tab being pointed at and the one in front, so a
            full strip is not a row of crosses
        */

            .tab-close {
                display: flex;

                align-items: center;

                justify-content: center;

                flex: none;

                width: 16px;

                height: 16px;

                margin-left: 4px;

                border-radius: 50%;

                font-size: 11px;

                visibility: hidden;
            }

            .tab:hover .tab-close,
            .tab.active .tab-close {
                visibility: visible;
            }

            .tab-close:hover {
                background: #5f6368;

                color: white;
            }

            /*
            Marks where a dragged tab would land. Positioned rather than
            inserted, so the strip does not shift under the cursor.
        */

            #tab-drop {
                position: absolute;

                top: 4px;

                display: none;

                width: 2px;

                height: 28px;

                border-radius: 1px;

                background: #8ab4f8;

                pointer-events: none;
            }

            #tab-drop.visible {
                display: block;
            }

            #new-tab {
                flex: none;

                width: 28px;

                height: 28px;

                margin-left: 4px;

                background: transparent;

                color: #9aa0a6;

                font-size: 15px;

                line-height: 1;
            }

            #new-tab:hover {
                background: #3c4043;

                color: white;
            }
        </style>
    </head>

    <body>
        <div id="tab-strip">
            <div id="tabs">
                <div id="tab-drop"></div>

                <button id="new-tab" title="New tab">+</button>
            </div>
        </div>

        <div id="bar">
            <button onclick="browserAPI.back()">←</button>

            <button onclick="browserAPI.forward()">→</button>

            <button id="home" onclick="browserAPI.goHome()" title="Home (right-click to change)">
                ⌂
            </button>

            <button onclick="browserAPI.reload()">↻</button>

            <div id="omnibox">
                <input id="url" placeholder="Enter website URL" />

                <div id="url-display" class="hidden">
                    <span id="url-scheme"></span><span id="url-host"></span
                    ><span id="url-rest"></span>
                </div>
            </div>

            <button id="search-engine" title="Change search engine">▾</button>

            <button id="shield" title="Ad and tracker blocking">🛡</button>

            <button id="set-home" title="Set this page as the homepage">⌂+</button>

            <button id="bookmark-toggle" title="Bookmark this page">☆</button>

            <button id="bookmark-bar-toggle" title="Show bookmarks bar">▤</button>

            <button id="focus-toggle" title="Focus mode">⤢</button>

            <!-- <button id="maximise" title="Maximise window">⤢</button> -->
        </div>

        <div id="bookmark-bar"><div id="bookmark-drop"></div></div>

        <script>
            const urlBox = document.getElementById('url');

            const urlDisplay = document.getElementById('url-display');

            const urlScheme = document.getElementById('url-scheme');

            const urlHost = document.getElementById('url-host');

            const urlRest = document.getElementById('url-rest');

            let currentUrl = '';

            function isEditing() {
                return document.activeElement === urlBox;
            }

            /*
        Split a URL the way a browser shows it: the scheme is dropped when
        it is https, "www." is dropped, the host is emphasised, and the
        path/query/fragment are dimmed.
    */

            function renderUrlDisplay(url) {
                if (!url) {
                    urlDisplay.classList.add('hidden');

                    return;
                }

                let parsed = null;

                try {
                    parsed = new URL(url);
                } catch {
                    parsed = null;
                }

                /*
            Anything that is not a web page (about:blank, data:, a bad
            URL) is shown verbatim rather than taken apart
        */

                if (!parsed || (parsed.protocol !== 'http:' && parsed.protocol !== 'https:')) {
                    urlScheme.textContent = '';

                    urlScheme.className = '';

                    urlHost.textContent = url;

                    urlRest.textContent = '';

                    urlDisplay.classList.remove('hidden');

                    return;
                }

                const insecure = parsed.protocol === 'http:';

                urlScheme.textContent = parsed.protocol === 'https:' ? '' : parsed.protocol + '//';

                urlScheme.className = insecure ? 'insecure' : '';

                urlHost.textContent = parsed.host.replace(/^www\./, '');

                const rest =
                    parsed.pathname === '/' && !parsed.search && !parsed.hash
                        ? ''
                        : parsed.pathname + parsed.search + parsed.hash;

                urlRest.textContent = rest;

                urlDisplay.classList.remove('hidden');
            }

            function showRealUrl() {
                urlDisplay.classList.add('hidden');

                urlBox.value = currentUrl;

                urlBox.focus();

                urlBox.select();

                /*
            select() leaves a long URL scrolled to its end; browsers
            keep the start of the URL in view
        */

                urlBox.scrollLeft = 0;
            }

            function setCurrentUrl(url) {
                currentUrl = url;

                /*
            Never overwrite what is being typed
        */

                if (isEditing()) return;

                urlBox.value = url;

                renderUrlDisplay(url);
            }

            /*
        mousedown rather than click, so the caret never lands mid-text
        before the select() below runs
    */

            urlDisplay.addEventListener('mousedown', (event) => {
                event.preventDefault();

                showRealUrl();
            });

            urlBox.addEventListener('focus', () => {
                urlDisplay.classList.add('hidden');
            });

            /*
        Restores the tidy display directly rather than waiting on a blur
        event, which does not arrive when the window is not focused
    */

            function stopEditing() {
                urlBox.value = currentUrl;

                renderUrlDisplay(currentUrl);

                urlBox.blur();
            }

            urlBox.addEventListener('blur', () => {
                urlBox.value = currentUrl;

                renderUrlDisplay(currentUrl);
            });

            urlBox.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    if (!urlBox.value.trim()) return;

                    /*
                Sent as typed. Whether it is somewhere to go or something
                to look up is decided in the main process, along with
                which engine to look it up with.
            */

                    browserAPI.submitOmnibox(urlBox.value);

                    stopEditing();
                }

                if (event.key === 'Escape') {
                    stopEditing();
                }
            });

            /*
        Search engine
    */

            const searchEngineButton = document.getElementById('search-engine');

            function engineLetterIcon(engine) {
                const letter = document.createElement('div');

                letter.id = 'search-engine-icon';

                letter.className = 'letter';

                letter.textContent = (engine.name || '?').charAt(0);

                return letter;
            }

            /*
        The engine is shown by its own icon rather than named in the
        placeholder, so the address bar stays about what is typed there
    */

            function showSearchEngine(engine) {
                if (!engine) return;

                searchEngineButton.textContent = '';

                if (engine.icon) {
                    const icon = document.createElement('img');

                    icon.id = 'search-engine-icon';

                    icon.src = engine.icon;

                    icon.addEventListener('error', () => {
                        icon.replaceWith(engineLetterIcon(engine));
                    });

                    searchEngineButton.appendChild(icon);
                } else {
                    searchEngineButton.appendChild(engineLetterIcon(engine));
                }

                const caret = document.createElement('span');

                caret.textContent = '▾';

                searchEngineButton.appendChild(caret);

                urlBox.placeholder = 'Search or enter a URL';

                searchEngineButton.title = 'Searching with ' + engine.name + ' — click to change';
            }

            searchEngineButton.addEventListener('click', () => {
                browserAPI.showSearchMenu();
            });

            urlBox.addEventListener('contextmenu', (event) => {
                event.preventDefault();

                browserAPI.showSearchMenu();
            });

            urlDisplay.addEventListener('contextmenu', (event) => {
                event.preventDefault();

                browserAPI.showSearchMenu();
            });

            browserAPI.onSearchEngineChange(showSearchEngine);

            browserAPI
                .getSearchEngine()
                .then(showSearchEngine)
                .catch(() => {
                    /*
                Asked before the main process was listening
            */
                });

            document.getElementById('home').addEventListener('contextmenu', (event) => {
                event.preventDefault();

                browserAPI.showHomeMenu();
            });

            /*
        Shield
    */

            const shieldButton = document.getElementById('shield');

            function renderShield(state) {
                shieldButton.textContent = '🛡';

                shieldButton.classList.toggle('off', !state.blocking);

                if (state.blocking && state.blocked > 0) {
                    const count = document.createElement('span');

                    count.className = 'count';

                    count.textContent = String(state.blocked);

                    shieldButton.appendChild(count);
                }

                if (!state.ready) {
                    /*
                Says so plainly when the lists could not be fetched,
                rather than looking like blocking is on
            */

                    shieldButton.title =
                        state.status === 'unavailable'
                            ? 'Ad blocker could not load its filter lists — retrying'
                            : 'Ad blocker still loading its filter lists';

                    return;
                }

                const site = state.host || 'this site';

                shieldButton.title = state.blocking
                    ? state.blocked +
                      ' blocked on this page — click to turn blocking off for ' +
                      site
                    : 'Blocking is off for ' + site + ' — click to turn it back on';
            }

            shieldButton.addEventListener('click', () => {
                browserAPI.toggleShieldForSite().then(renderShield);
            });

            browserAPI.onShieldState(renderShield);

            browserAPI
                .getShieldState()
                .then(renderShield)
                .catch(() => {
                    /*
                Asked before the main process was listening
            */
                });

            const setHomeButton = document.getElementById('set-home');

            const SET_HOME_GLYPH = setHomeButton.textContent;

            let confirmTimer = null;

            setHomeButton.addEventListener('click', () => {
                browserAPI.setHomeToCurrentPage().then((url) => {
                    /*
                Nothing to pin on a page that is not a web page
            */

                    if (!url) return;

                    setHomeButton.textContent = '✓';

                    setHomeButton.classList.add('confirmed');

                    setHomeButton.title = 'Homepage is now ' + url;

                    /*
                Restored from the glyph captured at startup, so clicking
                again mid-confirmation cannot make the tick stick
            */

                    clearTimeout(confirmTimer);

                    confirmTimer = setTimeout(() => {
                        setHomeButton.textContent = SET_HOME_GLYPH;

                        setHomeButton.classList.remove('confirmed');

                        setHomeButton.title = 'Set this page as the homepage';
                    }, 1400);
                });
            });

            browserAPI.onURLChange((url) => {
                setCurrentUrl(url);

                refreshBookmarks();
            });

            browserAPI.onLoading((loading) => {
                if (loading) {
                    document.title = 'Loading...';
                } else {
                    document.title = 'WebDesk';
                }
            });

            /*
        Bookmarks
    */

            const bookmarkToggle = document.getElementById('bookmark-toggle');

            const bookmarkBarToggle = document.getElementById('bookmark-bar-toggle');

            const bookmarkBar = document.getElementById('bookmark-bar');

            const dropIndicator = document.getElementById('bookmark-drop');

            const BAR_SHORTCUT = navigator.userAgent.includes('Mac') ? '⌘⇧B' : 'Ctrl+Shift+B';

            let bookmarks = [];

            let barVisible = true;

            /*
        Set for the length of a drag, so the bar ignores anything
        dragged into it from elsewhere
    */

            let dragUrl = '';

            let dropIndex = -1;

            function renderBookmarks(state) {
                bookmarks = state.bookmarks;

                barVisible = state.barVisible !== false;

                bookmarkToggle.textContent = state.bookmarked ? '★' : '☆';

                bookmarkToggle.classList.toggle('saved', state.bookmarked);

                bookmarkBarToggle.classList.toggle('on', barVisible);

                bookmarkBarToggle.title =
                    (barVisible ? 'Hide' : 'Show') + ' bookmarks bar (' + BAR_SHORTCUT + ')';

                bookmarkBar.classList.toggle('visible', barVisible);

                bookmarkBar.textContent = '';

                /*
            Cleared along with the chips, so it is put back rather
            than rebuilt
        */

                bookmarkBar.appendChild(dropIndicator);

                if (bookmarks.length === 0) {
                    const empty = document.createElement('div');

                    empty.id = 'bookmark-empty';

                    empty.textContent = 'Bookmarks you add with ☆ will appear here.';

                    bookmarkBar.appendChild(empty);
                }

                bookmarks.forEach((bookmark) => {
                    bookmarkBar.appendChild(createChip(bookmark));
                });

                syncToolbarHeight();
            }

            function createChip(bookmark) {
                const chip = document.createElement('div');

                chip.className = 'bookmark';

                chip.title = bookmark.title + '\n' + bookmark.url;

                chip.draggable = true;

                chip.dataset.url = bookmark.url;

                chip.appendChild(createIcon(bookmark));

                const label = document.createElement('span');

                label.className = 'bookmark-label';

                label.textContent = bookmark.title;

                chip.appendChild(label);

                /*
                Held down, the way a browser opens a link behind what
                is being read rather than in front of it
            */

                chip.addEventListener('click', (event) => {
                    const behind = event.metaKey || event.ctrlKey;

                    browserAPI.openBookmark(bookmark.url, {
                        newTab: behind,

                        background: behind
                    });
                });

                chip.addEventListener('contextmenu', (event) => {
                    event.preventDefault();

                    browserAPI.showBookmarkMenu(bookmark.url);
                });

                chip.addEventListener('dragstart', (event) => {
                    dragUrl = bookmark.url;

                    event.dataTransfer.effectAllowed = 'move';

                    /*
                The drag has to carry something before dragover fires
            */

                    event.dataTransfer.setData('text/plain', bookmark.url);

                    chip.classList.add('dragging');
                });

                chip.addEventListener('dragend', () => {
                    chip.classList.remove('dragging');

                    hideDropIndicator();

                    dragUrl = '';
                });

                return chip;
            }

            function createIcon(bookmark) {
                if (!bookmark.favicon) {
                    return createLetterIcon(bookmark);
                }

                const icon = document.createElement('img');

                icon.className = 'bookmark-icon';

                icon.src = bookmark.favicon;

                /*
            A site whose icon has moved or is blocked falls back to the
            lettered square rather than showing a broken image
        */

                icon.addEventListener('error', () => {
                    icon.replaceWith(createLetterIcon(bookmark));
                });

                return icon;
            }

            function createLetterIcon(bookmark) {
                const icon = document.createElement('div');

                icon.className = 'bookmark-icon bookmark-letter';

                try {
                    icon.textContent = new URL(bookmark.url).hostname
                        .replace(/^www\./, '')
                        .charAt(0);
                } catch {
                    icon.textContent = (bookmark.title || '?').charAt(0);
                }

                return icon;
            }

            /*
        Renaming is done in the bar itself, since the native context
        menu that starts it cannot hold a text field
    */

            function startRename(url) {
                const chip = Array.from(bookmarkBar.querySelectorAll('.bookmark')).find(
                    (candidate) => candidate.dataset.url === url
                );

                if (!chip) return;

                const label = chip.querySelector('.bookmark-label');

                const input = document.createElement('input');

                input.className = 'bookmark-rename';

                input.value = label.textContent;

                chip.draggable = false;

                label.replaceWith(input);

                input.focus();

                input.select();

                let finished = false;

                function finish(commit) {
                    if (finished) return;

                    finished = true;

                    if (commit && input.value.trim()) {
                        browserAPI.renameBookmark(url, input.value).then(applyState);
                    } else {
                        refreshBookmarks();
                    }
                }

                /*
            Clicking the field would otherwise open the bookmark
        */

                input.addEventListener('mousedown', (event) => {
                    event.stopPropagation();
                });

                input.addEventListener('click', (event) => {
                    event.stopPropagation();
                });

                input.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        finish(true);
                    }

                    if (event.key === 'Escape') {
                        finish(false);
                    }
                });

                input.addEventListener('blur', () => {
                    finish(true);
                });
            }

            /*
        The gap the dragged bookmark would fall into, from which chip
        centres the cursor has passed
    */

            function insertIndexFor(clientX) {
                const chips = bookmarkBar.querySelectorAll('.bookmark');

                for (let index = 0; index < chips.length; index += 1) {
                    const box = chips[index].getBoundingClientRect();

                    if (clientX < box.left + box.width / 2) {
                        return index;
                    }
                }

                return chips.length;
            }

            function showDropIndicator(index) {
                const chips = bookmarkBar.querySelectorAll('.bookmark');

                if (chips.length === 0) return;

                const last = chips[chips.length - 1];

                dropIndicator.style.left =
                    index < chips.length
                        ? chips[index].offsetLeft - 2 + 'px'
                        : last.offsetLeft + last.offsetWidth + 'px';

                dropIndicator.classList.add('visible');
            }

            function hideDropIndicator() {
                dropIndicator.classList.remove('visible');

                dropIndex = -1;
            }

            bookmarkBar.addEventListener('dragover', (event) => {
                if (!dragUrl) return;

                event.preventDefault();

                event.dataTransfer.dropEffect = 'move';

                dropIndex = insertIndexFor(event.clientX);

                showDropIndicator(dropIndex);
            });

            bookmarkBar.addEventListener('dragleave', (event) => {
                if (event.target === bookmarkBar) {
                    hideDropIndicator();
                }
            });

            bookmarkBar.addEventListener('drop', (event) => {
                if (!dragUrl || dropIndex === -1) return;

                event.preventDefault();

                const from = bookmarks.findIndex((bookmark) => bookmark.url === dragUrl);

                /*
            Where it lands once it has been lifted out of the bar, which
            is one place to the left when it moves rightwards
        */

                const target = dropIndex > from ? dropIndex - 1 : dropIndex;

                hideDropIndicator();

                if (from !== -1 && target !== from) {
                    browserAPI.moveBookmark(dragUrl, target).then(applyState);
                }
            });

            function applyState(state) {
                renderBookmarks(state);
            }

            function refreshBookmarks() {
                browserAPI
                    .getBookmarkState()
                    .then(applyState)
                    .catch(() => {
                        /*
                    Asked before the main process was listening
                */
                    });
            }

            /*
        The BrowserView sits on top of this page, so the bar is only
        visible if the view is pushed down to make room for it
    */

            function syncToolbarHeight() {
                const stripHeight = document.getElementById('tab-strip').offsetHeight;

                const barHeight = document.getElementById('bar').offsetHeight;

                browserAPI.setToolbarHeight(
                    stripHeight + barHeight + (barVisible ? bookmarkBar.offsetHeight : 0)
                );
            }

            bookmarkToggle.addEventListener('click', () => {
                browserAPI.toggleBookmark().then(applyState);
            });

            bookmarkBarToggle.addEventListener('click', () => {
                browserAPI.setBookmarkBarVisible(!barVisible).then(applyState);
            });

            /*
        Deleting from the context menu and the bar's shortcut both act
        in the main process, which pushes the new state back here
    */

            browserAPI.onBookmarkState(applyState);

            browserAPI.onBookmarkRename(startRename);

            refreshBookmarks();

            /*
        Tabs

        The strip is a picture of what the main process holds. Nothing is
        added or removed here; every click is sent over and the state that
        comes back is drawn.
    */

            const tabStrip = document.getElementById('tabs');

            const newTabButton = document.getElementById('new-tab');

            const tabDrop = document.getElementById('tab-drop');

            const NEW_TAB_SHORTCUT = navigator.userAgent.includes('Mac') ? '⌘T' : 'Ctrl+T';

            let tabs = [];

            /*
        Set for the length of a drag, so the strip ignores anything
        dragged into it from elsewhere
    */

            let dragTabId = null;

            let tabDropIndex = -1;

            newTabButton.title = 'New tab (' + NEW_TAB_SHORTCUT + ')';

            function renderTabs(state) {
                tabs = Array.isArray(state.tabs) ? state.tabs : [];

                tabStrip.textContent = '';

                /*
            Cleared along with the tabs, so they are put back rather
            than rebuilt
        */

                tabStrip.appendChild(tabDrop);

                tabs.forEach((tab) => {
                    tabStrip.appendChild(createTabChip(tab));
                });

                /*
            Last, so it follows the end of the strip rather than sitting
            out at the window edge
        */

                tabStrip.appendChild(newTabButton);
            }

            function tabLabel(tab) {
                if (tab.title) return tab.title;

                try {
                    return new URL(tab.url).hostname.replace(/^www\./, '');
                } catch {
                    return 'New tab';
                }
            }

            function createTabChip(tab) {
                const chip = document.createElement('div');

                chip.className = 'tab' + (tab.active ? ' active' : '');

                chip.title = tabLabel(tab) + (tab.url ? '\n' + tab.url : '');

                chip.draggable = true;

                chip.dataset.id = String(tab.id);

                chip.appendChild(createTabIcon(tab));

                const label = document.createElement('span');

                label.className = 'tab-label';

                label.textContent = tabLabel(tab);

                chip.appendChild(label);

                const close = document.createElement('span');

                close.className = 'tab-close';

                close.textContent = '✕';

                close.title = 'Close tab';

                close.addEventListener('click', (event) => {
                    /*
                The tab underneath would otherwise be selected on the
                way out
            */

                    event.stopPropagation();

                    browserAPI.closeTab(tab.id);
                });

                chip.appendChild(close);

                chip.addEventListener('click', () => {
                    if (!tab.active) {
                        browserAPI.selectTab(tab.id);
                    }
                });

                /*
            Middle-clicking a tab closes it, which is how every browser
            with a strip behaves
        */

                chip.addEventListener('auxclick', (event) => {
                    if (event.button !== 1) return;

                    event.preventDefault();

                    browserAPI.closeTab(tab.id);
                });

                chip.addEventListener('dragstart', (event) => {
                    dragTabId = tab.id;

                    event.dataTransfer.effectAllowed = 'move';

                    /*
                The drag has to carry something before dragover fires
            */

                    event.dataTransfer.setData('text/plain', String(tab.id));

                    chip.classList.add('dragging');
                });

                chip.addEventListener('dragend', () => {
                    chip.classList.remove('dragging');

                    hideTabDropIndicator();

                    dragTabId = null;
                });

                return chip;
            }

            function createTabIcon(tab) {
                if (tab.loading) {
                    const spinner = document.createElement('div');

                    spinner.className = 'tab-spinner';

                    return spinner;
                }

                if (!tab.favicon) {
                    return createTabLetterIcon(tab);
                }

                const icon = document.createElement('img');

                icon.className = 'tab-icon';

                icon.src = tab.favicon;

                /*
            A site whose icon has moved or is blocked falls back to the
            lettered square rather than showing a broken image
        */

                icon.addEventListener('error', () => {
                    icon.replaceWith(createTabLetterIcon(tab));
                });

                return icon;
            }

            function createTabLetterIcon(tab) {
                const icon = document.createElement('div');

                icon.className = 'tab-icon tab-letter';

                try {
                    icon.textContent = new URL(tab.url).hostname.replace(/^www\./, '').charAt(0);
                } catch {
                    icon.textContent = (tab.title || '?').charAt(0);
                }

                return icon;
            }

            /*
        The gap the dragged tab would fall into, from which tab centres
        the cursor has passed
    */

            function tabInsertIndexFor(clientX) {
                const chips = tabStrip.querySelectorAll('.tab');

                for (let index = 0; index < chips.length; index += 1) {
                    const box = chips[index].getBoundingClientRect();

                    if (clientX < box.left + box.width / 2) {
                        return index;
                    }
                }

                return chips.length;
            }

            function showTabDropIndicator(index) {
                const chips = tabStrip.querySelectorAll('.tab');

                if (chips.length === 0) return;

                const last = chips[chips.length - 1];

                tabDrop.style.left =
                    index < chips.length
                        ? chips[index].offsetLeft - 2 + 'px'
                        : last.offsetLeft + last.offsetWidth + 'px';

                tabDrop.classList.add('visible');
            }

            function hideTabDropIndicator() {
                tabDrop.classList.remove('visible');

                tabDropIndex = -1;
            }

            tabStrip.addEventListener('dragover', (event) => {
                if (dragTabId === null) return;

                event.preventDefault();

                event.dataTransfer.dropEffect = 'move';

                tabDropIndex = tabInsertIndexFor(event.clientX);

                showTabDropIndicator(tabDropIndex);
            });

            tabStrip.addEventListener('dragleave', (event) => {
                if (event.target === tabStrip) {
                    hideTabDropIndicator();
                }
            });

            tabStrip.addEventListener('drop', (event) => {
                if (dragTabId === null || tabDropIndex === -1) return;

                event.preventDefault();

                const from = tabs.findIndex((tab) => tab.id === dragTabId);

                /*
            Where it lands once it has been lifted out of the strip,
            which is one place to the left when it moves rightwards
        */

                const target = tabDropIndex > from ? tabDropIndex - 1 : tabDropIndex;

                hideTabDropIndicator();

                if (from !== -1 && target !== from) {
                    browserAPI.moveTab(dragTabId, target);
                }
            });

            newTabButton.addEventListener('click', () => {
                browserAPI.newTab();
            });

            browserAPI.onTabState(renderTabs);

            browserAPI
                .getTabState()
                .then(renderTabs)
                .catch(() => {
                    /*
                Asked before the main process was listening
            */
                });

            /*
        Focus mode
    */

            const focusToggle = document.getElementById('focus-toggle');

            function showFocusMode(active) {
                focusToggle.textContent = active ? '⤡' : '⤢'; /*'◉' : '◎';*/

                focusToggle.classList.toggle('on', active);

                focusToggle.title = active
                    ? 'Leave focus mode (⌘⇧F)'
                    : 'Focus mode — fill the screen and stay on top (⌘⇧F)';
            }

            focusToggle.addEventListener('click', () => {
                browserAPI.toggleFocusMode().then(showFocusMode);
            });

            /*
        The shortcut works from inside the page too, so the button is
        told rather than assuming it is the only way in or out
    */

            browserAPI.onFocusModeChange(showFocusMode);

            showFocusMode(false);

            /*
        Maximise
    */

            const maximiseButton = document.getElementById('maximise');

            /*
        The button is not in the bar at the moment, so nothing below it
        in this file would run if it were reached for anyway
    */

            if (maximiseButton) {
                wireMaximiseButton();
            }

            function showMaximised(maximised) {
                maximiseButton.textContent = maximised ? '⤡' : '⤢';

                maximiseButton.title = maximised ? 'Restore window' : 'Maximise window';
            }

            function wireMaximiseButton() {
                maximiseButton.addEventListener('click', () => {
                    browserAPI.toggleMaximise().then(showMaximised);
                });

                /*
            The window can also be maximised from its own title bar, so
            the icon follows the window rather than only its own clicks
        */

                browserAPI.onMaximiseChange(showMaximised);

                browserAPI
                    .isMaximised()
                    .then(showMaximised)
                    .catch(() => {
                        /*
                    Asked before the main process was listening
                */
                    });
            }
        </script>
    </body>
</html>
