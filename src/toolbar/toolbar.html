        <div id="sub-tab-strip">
            <div id="sub-tabs"></div>
        </div>

        <script>
            /*
                Small inline icon set standing in for SF Symbols, so
                nothing here depends on emoji rendering or an external
                icon font/library. Every icon inherits `currentColor`,
                which is how they pick up hover state and dark/light
                colors for free.
            */

            function svgIcon(paths, options = {}) {
                const size = options.size || 14;

                const strokeWidth = options.strokeWidth || 1.5;

                return (
                    '<svg viewBox="0 0 16 16" width="' +
                    size +
                    '" height="' +
                    size +
                    '" fill="none" stroke="currentColor" stroke-width="' +
                    strokeWidth +
                    '" stroke-linecap="round" stroke-linejoin="round">' +
                    paths +
                    '</svg>'
                );
            }

            const ICONS = {
                chevronDown: svgIcon('<path d="M4 6.2 8 10l4-3.8"/>', { size: 10, strokeWidth: 1.6 }),

                homePlus: svgIcon(
                    '<path d="M2.3 8.2 7 4.4l3.7 3"/><path d="M3.6 7.4V12.5h6.8V8.6"/><path d="M12.3 1.8v4M10.3 3.8h4"/>'
                ),

                check: svgIcon('<path d="M3 8.5l3.3 3.3L13 4.2"/>'),

                close: svgIcon('<path d="M4 4l8 8M12 4l-8 8"/>', { size: 10, strokeWidth: 1.6 }),

                themeSystem: svgIcon(
                    '<circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12Z" fill="currentColor" stroke="none"/>'
                ),

                themeLight: svgIcon(
                    '<circle cx="8" cy="8" r="3"/><path d="M8 1.3v1.8M8 12.9v1.8M1.3 8h1.8M12.9 8h1.8M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M3.5 12.5l1.3-1.3M11.2 4.8l1.3-1.3"/>'
                ),

                themeDark: svgIcon(
                    '<path d="M13.2 9.9A5.6 5.6 0 1 1 6.1 2.8a4.6 4.6 0 0 0 7.1 7.1Z" fill="currentColor" stroke="none"/>'
                )
            };

            /*
                A themed, fast tooltip for every icon and tab/bookmark
                chip, reading from a data-tooltip attribute rather than
                the browser's own slow, plain title tooltip. Delegated to
                the document so it works for chips created after the
                page loads without any per-element wiring.

                Has to stay inside the visible toolbar strip: the
                BrowserView holding the actual page is a native layer on
                top of this one for anything below that, so a bubble
                positioned past it would be drawn but invisible.
            */

            const tooltipBubble = document.createElement('div');

            tooltipBubble.id = 'tooltip-bubble';

            document.body.appendChild(tooltipBubble);

            let tooltipTimer = null;

            let tooltipActiveEl = null;

            function tooltipTargetFor(node) {
                return node && node.closest ? node.closest('[data-tooltip]') : null;
            }

            function positionTooltip(target) {
                const rect = target.getBoundingClientRect();

                const bubbleRect = tooltipBubble.getBoundingClientRect();

                const safeBottom = document.body.getBoundingClientRect().height - 2;

                /*
                Above the icon by default, the way a native tooltip
                reads best against a toolbar. Falls back to below only
                when there isn't room above — and even then has to stay
                inside the toolbar strip, since the BrowserView holding
                the actual page is a native layer on top of anything
                past that.
            */

                let top = rect.top - bubbleRect.height - 6;

                if (top < 2) {
                    const below = rect.bottom + 6;

                    top = below + bubbleRect.height <= safeBottom ? below : safeBottom - bubbleRect.height;
                }

                top = Math.max(2, top);

                let left = rect.left + rect.width / 2 - bubbleRect.width / 2;

                left = Math.max(4, Math.min(left, window.innerWidth - bubbleRect.width - 4));

                tooltipBubble.style.top = top + 'px';

                tooltipBubble.style.left = left + 'px';
            }

            function showTooltip(target) {
                tooltipBubble.textContent = target.dataset.tooltip;

                tooltipBubble.classList.add('visible');

                positionTooltip(target);
            }

            function hideTooltip() {
                clearTimeout(tooltipTimer);

                tooltipTimer = null;

                tooltipActiveEl = null;

                tooltipBubble.classList.remove('visible');
            }

            document.addEventListener('mouseover', (event) => {
                const target = tooltipTargetFor(event.target);

                if (!target || target === tooltipActiveEl) return;

                hideTooltip();

                tooltipActiveEl = target;

                tooltipTimer = setTimeout(() => showTooltip(target), 450);
            });

            document.addEventListener('mouseout', (event) => {
                if (!tooltipActiveEl) return;

                if (tooltipTargetFor(event.target) !== tooltipActiveEl) return;

                const to = event.relatedTarget;

                if (to && tooltipActiveEl.contains(to)) return;

                hideTooltip();
            });

            document.addEventListener('mousedown', hideTooltip);

            window.addEventListener('scroll', hideTooltip, true);

            const urlBox = document.getElementById('url');

            const urlDisplay = document.getElementById('url-display');

            const urlScheme = document.getElementById('url-scheme');

            const urlHost = document.getElementById('url-host');

            const urlRest = document.getElementById('url-rest');

            const urlFavicon = document.getElementById('url-favicon');

            /*
                Safari falls back to a plain globe for a site with no
                favicon of its own; drawn once as a data URI so the
                address bar never shows a broken image
            */

            const DEFAULT_FAVICON =
                'data:image/svg+xml,' +
                encodeURIComponent(
                    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">' +
                        '<circle cx="8" cy="8" r="6.2" fill="none" stroke="#8e8e93" stroke-width="1.3"/>' +
                        '<path d="M2 8h12M8 1.8c2 2 2 10.4 0 12.4M8 1.8c-2 2-2 10.4 0 12.4" fill="none" stroke="#8e8e93" stroke-width="1.1"/>' +
                        '</svg>'
                );

            /*
                Reads off the same tab list the tab strip already renders
                from, rather than tracking favicons separately
            */

            function updateAddressFavicon() {
                const active = tabs.find((tab) => tab.active);

                urlFavicon.onerror = () => {
                    urlFavicon.onerror = null;

                    urlFavicon.src = DEFAULT_FAVICON;
                };

                urlFavicon.src = (active && active.favicon) || DEFAULT_FAVICON;
            }

            let currentUrl = '';

            let savePasswordPromptState = null;

            let savePasswordPromptTimerId = null;

            function isEditing() {
                return document.activeElement === urlBox;
            }

            function clearSavePasswordPromptUi() {
                const prompt = document.getElementById('save-password-prompt');

                const text = document.getElementById('save-password-prompt-text');

                const timer = document.getElementById('save-password-prompt-timer');

                if (savePasswordPromptTimerId) {
                    clearInterval(savePasswordPromptTimerId);

                    savePasswordPromptTimerId = null;
                }

                savePasswordPromptState = null;

                prompt.classList.remove('visible');

                text.textContent = '';

                timer.textContent = '';

                syncToolbarHeight();
            }

            function renderSavePasswordPrompt(prompt) {
                console.log('[save-password-debug] renderSavePasswordPrompt called with:', prompt);

                const promptElement = document.getElementById('save-password-prompt');

                const textElement = document.getElementById('save-password-prompt-text');

                const timerElement = document.getElementById('save-password-prompt-timer');

                if (!prompt) {
                    clearSavePasswordPromptUi();

                    return;
                }

                const username = prompt.username || prompt.hostname || 'this site';

                const seconds = Math.max(1, Number(prompt.seconds) || 10);

                savePasswordPromptState = { seconds };

                textElement.textContent = `${prompt.updating ? 'Update' : 'Save'} password for ${username}?`;

                timerElement.textContent = `${seconds}s`;

                promptElement.classList.add('visible');

                if (savePasswordPromptTimerId) {
                    clearInterval(savePasswordPromptTimerId);
                }

                savePasswordPromptTimerId = setInterval(() => {
                    if (!savePasswordPromptState) return;

                    savePasswordPromptState.seconds -= 1;

                    if (savePasswordPromptState.seconds <= 0) {
                        clearSavePasswordPromptUi();

                        return;
                    }

                    timerElement.textContent = `${savePasswordPromptState.seconds}s`;
                }, 1000);

                syncToolbarHeight();
            }

            /*
        Split a URL the way a browser shows it: the scheme is dropped when
        it is https, "www." is dropped, the host is emphasised, and the
        path/query/fragment are dimmed.
    */

            function renderUrlDisplay(url) {
                if (!url) {
                    urlDisplay.classList.add('hidden');

                    return;
                }

                let parsed = null;

                try {
                    parsed = new URL(url);
                } catch {
                    parsed = null;
                }

                /*
            Anything that is not a web page (about:blank, data:, a bad
            URL) is shown verbatim rather than taken apart
        */

                if (!parsed || (parsed.protocol !== 'http:' && parsed.protocol !== 'https:')) {
                    urlScheme.textContent = '';

                    urlScheme.className = '';

                    urlHost.textContent = url;

                    urlRest.textContent = '';

                    urlDisplay.classList.remove('hidden');

                    return;
                }

                const insecure = parsed.protocol === 'http:';

                urlScheme.textContent = parsed.protocol === 'https:' ? '' : parsed.protocol + '//';

                urlScheme.className = insecure ? 'insecure' : '';

                urlHost.textContent = parsed.host.replace(/^www\./, '');

                const rest =
                    parsed.pathname === '/' && !parsed.search && !parsed.hash
                        ? ''
                        : parsed.pathname + parsed.search + parsed.hash;

                urlRest.textContent = rest;

                urlDisplay.classList.remove('hidden');
            }

            function showRealUrl() {
                urlDisplay.classList.add('hidden');

                urlBox.value = currentUrl;

                urlBox.focus();

                urlBox.select();

                /*
            select() leaves a long URL scrolled to its end; browsers
            keep the start of the URL in view
        */

                urlBox.scrollLeft = 0;
            }

            function setCurrentUrl(url) {
                currentUrl = url;

                /*
            Never overwrite what is being typed
        */

                if (isEditing()) return;

                urlBox.value = url;

                renderUrlDisplay(url);
            }

            /*
        mousedown rather than click, so the caret never lands mid-text
        before the select() below runs
    */

            urlDisplay.addEventListener('mousedown', (event) => {
                event.preventDefault();

                showRealUrl();
            });

            urlBox.addEventListener('focus', () => {
                urlDisplay.classList.add('hidden');
            });

            /*
        Restores the tidy display directly rather than waiting on a blur
        event, which does not arrive when the window is not focused
    */

            function stopEditing() {
                urlBox.value = currentUrl;

                renderUrlDisplay(currentUrl);

                urlBox.blur();
            }

            urlBox.addEventListener('blur', () => {
                urlBox.value = currentUrl;

                renderUrlDisplay(currentUrl);
            });

            urlBox.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    if (!urlBox.value.trim()) return;

                    /*
                Sent as typed. Whether it is somewhere to go or something
                to look up is decided in the main process, along with
                which engine to look it up with.
            */

                    browserAPI.submitOmnibox(urlBox.value);

                    stopEditing();
                }

                if (event.key === 'Escape') {
                    stopEditing();
                }
            });

            /*
        Search engine
    */

            const searchEngineButton = document.getElementById('search-engine');

            function engineLetterIcon(engine) {
                const letter = document.createElement('div');

                letter.id = 'search-engine-icon';

                letter.className = 'letter';

                letter.textContent = (engine.name || '?').charAt(0);

                return letter;
            }

            /*
        The engine is shown by its own icon rather than named in the
        placeholder, so the address bar stays about what is typed there
    */

            function showSearchEngine(engine) {
                if (!engine) return;

                searchEngineButton.textContent = '';

                if (engine.icon) {
                    const icon = document.createElement('img');

                    icon.id = 'search-engine-icon';

                    icon.src = engine.icon;

                    icon.addEventListener('error', () => {
                        icon.replaceWith(engineLetterIcon(engine));
                    });

                    searchEngineButton.appendChild(icon);
                } else {
                    searchEngineButton.appendChild(engineLetterIcon(engine));
                }

                const caret = document.createElement('span');

                caret.innerHTML = ICONS.chevronDown;

                searchEngineButton.appendChild(caret);

                urlBox.placeholder = 'Search or enter a URL';

                searchEngineButton.dataset.tooltip = engine.name;
            }

            searchEngineButton.addEventListener('click', () => {
                browserAPI.showSearchMenu();
            });

            urlBox.addEventListener('contextmenu', (event) => {
                event.preventDefault();

                browserAPI.showSearchMenu();
            });

            urlDisplay.addEventListener('contextmenu', (event) => {
                event.preventDefault();

                browserAPI.showSearchMenu();
            });

            browserAPI.onSearchEngineChange(showSearchEngine);

            browserAPI
                .getSearchEngine()
                .then(showSearchEngine)
                .catch(() => {
                    /*
                Asked before the main process was listening
            */
                });

            document.getElementById('home').addEventListener('contextmenu', (event) => {
                event.preventDefault();

                browserAPI.showHomeMenu();
            });

            /*
        Shield
    */

            const shieldButton = document.getElementById('shield');

            const shieldCount = document.getElementById('shield-count');

            function renderShield(state) {
                shieldButton.classList.toggle('off', !state.blocking);

                if (state.blocking && state.blocked > 0) {
                    shieldCount.textContent = String(state.blocked);
                } else {
                    shieldCount.textContent = '';
                }

                if (!state.ready) {
                    /*
                Says so plainly when the lists could not be fetched,
                rather than looking like blocking is on
            */

                    shieldButton.dataset.tooltip =
                        state.status === 'unavailable' ? 'Blocker Unavailable' : 'Loading…';

                    return;
                }

                shieldButton.dataset.tooltip = state.blocking ? 'Ad Blocker' : 'Blocker Off';
            }

            shieldButton.addEventListener('click', () => {
                browserAPI.toggleShieldForSite().then(renderShield);
            });

            browserAPI.onShieldState(renderShield);

            browserAPI
                .getShieldState()
                .then(renderShield)
                .catch(() => {
                    /*
                Asked before the main process was listening
            */
                });

            const setHomeButton = document.getElementById('set-home');

            setHomeButton.innerHTML = ICONS.homePlus;

            const SET_HOME_ICON = setHomeButton.innerHTML;

            let confirmTimer = null;

            setHomeButton.addEventListener('click', () => {
                browserAPI.setHomeToCurrentPage().then((url) => {
                    /*
                Nothing to pin on a page that is not a web page
            */

                    if (!url) return;

                    setHomeButton.innerHTML = ICONS.check;

                    setHomeButton.classList.add('confirmed');

                    setHomeButton.dataset.tooltip = 'Homepage Set';

                    /*
                Restored from the icon captured at startup, so clicking
                again mid-confirmation cannot make the tick stick
            */

                    clearTimeout(confirmTimer);

                    confirmTimer = setTimeout(() => {
                        setHomeButton.innerHTML = SET_HOME_ICON;

                        setHomeButton.classList.remove('confirmed');

                        setHomeButton.dataset.tooltip = 'Set Homepage';
                    }, 1400);
                });
            });

            /*
        Downloads

        The list itself lives in a separate small popover window (see
        downloadsWindow.js) — this button only opens/closes it and
        keeps its own badge in sync with however many downloads are
        still running
    */

            const downloadsButton = document.getElementById('downloads');

            const downloadsCount = document.getElementById('downloads-count');

            function renderDownloadsBadge(downloads) {
                const list = Array.isArray(downloads) ? downloads : [];

                const active = list.filter(
                    (download) => download.state === 'progressing' || download.state === 'paused'
                );

                downloadsCount.textContent = active.length > 0 ? String(active.length) : '';

                downloadsButton.classList.toggle(
                    'active',
                    active.some((download) => download.state === 'progressing')
                );
            }

            downloadsButton.addEventListener('click', () => {
                const rect = downloadsButton.getBoundingClientRect();

                browserAPI.toggleDownloadsPanel({
                    left: rect.left,

                    top: rect.bottom,

                    width: rect.width,

                    height: 0
                });
            });

            /*
                Same anchored-popover pattern as Downloads above, but the
                badge here reflects whether the page in front of you right
                now is translated rather than counting anything running in
                the background — see translateWindow.js for the popover
                itself
            */

            const translateButton = document.getElementById('translate');

            translateButton.addEventListener('click', () => {
                const rect = translateButton.getBoundingClientRect();

                browserAPI.toggleTranslatePanel({
                    left: rect.left,

                    top: rect.bottom,

                    width: rect.width,

                    height: 0
                });
            });

            browserAPI.onTranslateBadgeState((state) => {
                translateButton.classList.toggle('on', Boolean(state && state.translated));
            });

            browserAPI
                .getDownloads()
                .then(renderDownloadsBadge)
                .catch(() => {
                    /*
                Asked before the main process was listening
            */
                });

            browserAPI.onDownloadState(renderDownloadsBadge);

            /*
        New Window
    */

            document.getElementById('new-window').addEventListener('click', () => {
                browserAPI.openNewWindow();
            });

            browserAPI.onURLChange((url) => {
                setCurrentUrl(url);

                refreshBookmarks();
            });

            browserAPI.onLoading((loading) => {
                if (loading) {
                    document.title = 'Loading...';
                } else {
                    document.title = 'WebDesk';
                }
            });

            /*
        Bookmarks
    */

            const bookmarkToggle = document.getElementById('bookmark-toggle');

            const bookmarkBarToggle = document.getElementById('bookmark-bar-toggle');

            const bookmarkBar = document.getElementById('bookmark-bar');

            const dropIndicator = document.getElementById('bookmark-drop');

            const BAR_SHORTCUT = navigator.userAgent.includes('Mac') ? '⌘⇧B' : 'Ctrl+Shift+B';

            let bookmarks = [];

            let barVisible = true;

            /*
        Set for the length of a drag, so the bar ignores anything
        dragged into it from elsewhere
    */

            let dragUrl = '';

            let dropIndex = -1;

            function renderBookmarks(state) {
                bookmarks = state.bookmarks;

                barVisible = state.barVisible !== false;

                bookmarkToggle.classList.toggle('saved', state.bookmarked);

                bookmarkToggle.dataset.tooltip = state.bookmarked ? 'Remove Bookmark' : 'Add Bookmark';

                bookmarkBarToggle.classList.toggle('on', barVisible);

                bookmarkBarToggle.dataset.tooltip =
                    (barVisible ? 'Hide' : 'Show') + ' Favorites ' + BAR_SHORTCUT;

                bookmarkBar.classList.toggle('visible', barVisible);

                bookmarkBar.textContent = '';

                /*
            Cleared along with the chips, so it is put back rather
            than rebuilt
        */

                bookmarkBar.appendChild(dropIndicator);

                if (bookmarks.length === 0) {
                    const empty = document.createElement('div');

                    empty.id = 'bookmark-empty';

                    empty.textContent = 'Bookmarks you add with the star will appear here.';

                    bookmarkBar.appendChild(empty);
                }

                bookmarks.forEach((bookmark) => {
                    bookmarkBar.appendChild(createChip(bookmark));
                });

                syncToolbarHeight();
            }

            function createChip(bookmark) {
                const chip = document.createElement('div');

                chip.className = 'bookmark';

                chip.dataset.tooltip = bookmark.title + '\n' + bookmark.url;

                chip.draggable = true;

                chip.dataset.url = bookmark.url;

                chip.appendChild(createIcon(bookmark));

                const label = document.createElement('span');

                label.className = 'bookmark-label';

                label.textContent = bookmark.title;

                chip.appendChild(label);

                /*
                Held down, the way a browser opens a link behind what
                is being read rather than in front of it
            */

                chip.addEventListener('click', (event) => {
                    const behind = event.metaKey || event.ctrlKey;

                    browserAPI.openBookmark(bookmark.url, {
                        newTab: behind,

                        background: behind
                    });
                });

                chip.addEventListener('contextmenu', (event) => {
                    event.preventDefault();

                    browserAPI.showBookmarkMenu(bookmark.url);
                });

                chip.addEventListener('dragstart', (event) => {
                    dragUrl = bookmark.url;

                    event.dataTransfer.effectAllowed = 'move';

                    /*
                The drag has to carry something before dragover fires
            */

                    event.dataTransfer.setData('text/plain', bookmark.url);

                    chip.classList.add('dragging');
                });

                chip.addEventListener('dragend', () => {
                    chip.classList.remove('dragging');

                    hideDropIndicator();

                    dragUrl = '';
                });

                return chip;
            }

            function createIcon(bookmark) {
                if (!bookmark.favicon) {
                    return createLetterIcon(bookmark);
                }

                const icon = document.createElement('img');

                icon.className = 'bookmark-icon';

                icon.src = bookmark.favicon;

                /*
            A site whose icon has moved or is blocked falls back to the
            lettered square rather than showing a broken image
        */

                icon.addEventListener('error', () => {
                    icon.replaceWith(createLetterIcon(bookmark));
                });

                return icon;
            }

            function createLetterIcon(bookmark) {
                const icon = document.createElement('div');

                icon.className = 'bookmark-icon bookmark-letter';

                try {
                    icon.textContent = new URL(bookmark.url).hostname
                        .replace(/^www\./, '')
                        .charAt(0);
                } catch {
                    icon.textContent = (bookmark.title || '?').charAt(0);
                }

                return icon;
            }

            /*
        Renaming is done in the bar itself, since the native context
        menu that starts it cannot hold a text field
    */

            function startRename(url) {
                const chip = Array.from(bookmarkBar.querySelectorAll('.bookmark')).find(
                    (candidate) => candidate.dataset.url === url
                );

                if (!chip) return;

                const label = chip.querySelector('.bookmark-label');

                const input = document.createElement('input');

                input.className = 'bookmark-rename';

                input.value = label.textContent;

                chip.draggable = false;

                label.replaceWith(input);

                input.focus();

                input.select();

                let finished = false;

                function finish(commit) {
                    if (finished) return;

                    finished = true;

                    if (commit && input.value.trim()) {
                        browserAPI.renameBookmark(url, input.value).then(applyState);
                    } else {
                        refreshBookmarks();
                    }
                }

                /*
            Clicking the field would otherwise open the bookmark
        */

                input.addEventListener('mousedown', (event) => {
                    event.stopPropagation();
                });

                input.addEventListener('click', (event) => {
                    event.stopPropagation();
                });

                input.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter') {
                        finish(true);
                    }

                    if (event.key === 'Escape') {
                        finish(false);
                    }
                });

                input.addEventListener('blur', () => {
                    finish(true);
                });
            }

            /*
        The gap the dragged bookmark would fall into, from which chip
        centres the cursor has passed
    */

            function insertIndexFor(clientX) {
                const chips = bookmarkBar.querySelectorAll('.bookmark');

                for (let index = 0; index < chips.length; index += 1) {
                    const box = chips[index].getBoundingClientRect();

                    if (clientX < box.left + box.width / 2) {
                        return index;
                    }
                }

                return chips.length;
            }

            function showDropIndicator(index) {
                const chips = bookmarkBar.querySelectorAll('.bookmark');

                if (chips.length === 0) return;

                const last = chips[chips.length - 1];

                dropIndicator.style.left =
                    index < chips.length
                        ? chips[index].offsetLeft - 2 + 'px'
                        : last.offsetLeft + last.offsetWidth + 'px';

                dropIndicator.classList.add('visible');
            }

            function hideDropIndicator() {
                dropIndicator.classList.remove('visible');

                dropIndex = -1;
            }

            bookmarkBar.addEventListener('dragover', (event) => {
                if (!dragUrl) return;

                event.preventDefault();

                event.dataTransfer.dropEffect = 'move';

                dropIndex = insertIndexFor(event.clientX);

                showDropIndicator(dropIndex);
            });

            bookmarkBar.addEventListener('dragleave', (event) => {
                if (event.target === bookmarkBar) {
                    hideDropIndicator();
                }
            });

            bookmarkBar.addEventListener('drop', (event) => {
                if (!dragUrl || dropIndex === -1) return;

                event.preventDefault();

                const from = bookmarks.findIndex((bookmark) => bookmark.url === dragUrl);

                /*
            Where it lands once it has been lifted out of the bar, which
            is one place to the left when it moves rightwards
        */

                const target = dropIndex > from ? dropIndex - 1 : dropIndex;

                hideDropIndicator();

                if (from !== -1 && target !== from) {
                    browserAPI.moveBookmark(dragUrl, target).then(applyState);
                }
            });

            function applyState(state) {
                renderBookmarks(state);
            }

            function refreshBookmarks() {
                browserAPI
                    .getBookmarkState()
                    .then(applyState)
                    .catch(() => {
                        /*
                    Asked before the main process was listening
                */
                    });
            }

            /*
        The BrowserView sits on top of this page, so the bar is only
        visible if the view is pushed down to make room for it
    */

            function syncToolbarHeight() {
                const stripHeight = document.getElementById('tab-strip').offsetHeight;

                const barHeight = document.getElementById('bar').offsetHeight;

                const prompt = document.getElementById('save-password-prompt');

                const promptHeight = prompt.classList.contains('visible') ? prompt.offsetHeight : 0;

                const subTabStripHeight = subTabStrip.classList.contains('visible')
                    ? subTabStrip.offsetHeight
                    : 0;

                browserAPI.setToolbarHeight(
                    stripHeight +
                        barHeight +
                        promptHeight +
                        subTabStripHeight +
                        (barVisible ? bookmarkBar.offsetHeight : 0)
                );
            }

            bookmarkToggle.addEventListener('click', () => {
                browserAPI.toggleBookmark().then(applyState);
            });

            bookmarkBarToggle.addEventListener('click', () => {
                browserAPI.setBookmarkBarVisible(!barVisible).then(applyState);
            });

            document.getElementById('passwords').addEventListener('click', () => {
                browserAPI.openPasswordManager();
            });

            document.getElementById('save-password-save').addEventListener('click', async () => {
                await browserAPI.saveCapturedPassword();

                clearSavePasswordPromptUi();
            });

            document.getElementById('save-password-dismiss').addEventListener('click', () => {
                browserAPI.dismissSavePasswordPrompt();
            });

            console.log('[save-password-debug] registering onSavePasswordPrompt listener');

            browserAPI.onSavePasswordPrompt(renderSavePasswordPrompt);

            /*
        Deleting from the context menu and the bar's shortcut both act
        in the main process, which pushes the new state back here
    */

            browserAPI.onBookmarkState(applyState);

            browserAPI.onBookmarkRename(startRename);

            refreshBookmarks();

            /*
        Tabs

        The strip is a picture of what the main process holds. Nothing is
        added or removed here; every click is sent over and the state that
        comes back is drawn.
    */

            const tabStrip = document.getElementById('tabs');

            const newTabButton = document.getElementById('new-tab');

            const tabDrop = document.getElementById('tab-drop');

            const groupTabsToggle = document.getElementById('group-tabs-toggle');

            const subTabStrip = document.getElementById('sub-tab-strip');

            const subTabs = document.getElementById('sub-tabs');

            const NEW_TAB_SHORTCUT = navigator.userAgent.includes('Mac') ? '⌘T' : 'Ctrl+T';

            const CLOSE_TAB_SHORTCUT = navigator.userAgent.includes('Mac') ? '⌘W' : 'Ctrl+W';

            let tabs = [];

            /*
        Set for the length of a drag, so the strip ignores anything
        dragged into it from elsewhere
    */

            let dragTabId = null;

            let tabDropIndex = -1;

            /*
        Whether the strip is showing one chip per site (with the active
        site's real tabs listed in the row below) instead of one chip
        per tab. Purely a display choice — the tabs themselves, their
        order, and their ids in the main process are untouched by it.
    */

            let groupedMode = false;

            newTabButton.dataset.tooltip = 'New Tab ' + NEW_TAB_SHORTCUT;

            function renderTabs(state) {
                tabs = Array.isArray(state.tabs) ? state.tabs : [];

                if (groupedMode) {
                    renderGroupedTabs();
                } else {
                    renderFlatTabs();
                }

                updateAddressFavicon();

                syncToolbarHeight();
            }

            function renderFlatTabs() {
                tabStrip.textContent = '';

                /*
            Cleared along with the tabs, so they are put back rather
            than rebuilt
        */

                tabStrip.appendChild(tabDrop);

                tabs.forEach((tab) => {
                    tabStrip.appendChild(createTabChip(tab));
                });

                /*
            Last, so it follows the end of the strip rather than sitting
            out at the window edge
        */

                tabStrip.appendChild(newTabButton);

                subTabStrip.classList.remove('visible');

                subTabs.textContent = '';
            }

            /*
        The site a tab is grouped under. Tabs on the same hostname land
        in the same group regardless of path, the way a browser's own
        tab groups key off the site rather than the exact page.
    */

            function siteKeyFor(tab) {
                try {
                    return new URL(tab.url).hostname.replace(/^www\./, '') || 'New Tab';
                } catch {
                    return tab.url || 'New Tab';
                }
            }

            /*
        Groups, in the order their site first appears among the open
        tabs — so toggling grouping on and off doesn't reshuffle
        anything the tab order didn't already imply.
    */

            function buildGroups() {
                const order = [];

                const membersByKey = new Map();

                tabs.forEach((tab) => {
                    const key = siteKeyFor(tab);

                    if (!membersByKey.has(key)) {
                        membersByKey.set(key, []);

                        order.push(key);
                    }

                    membersByKey.get(key).push(tab);
                });

                return order.map((key) => ({ key, members: membersByKey.get(key) }));
            }

            function renderGroupedTabs() {
                tabStrip.textContent = '';

                tabStrip.appendChild(tabDrop);

                const groups = buildGroups();

                let activeGroup = null;

                groups.forEach((group) => {
                    tabStrip.appendChild(createGroupChip(group));

                    if (group.members.some((tab) => tab.active)) {
                        activeGroup = group;
                    }
                });

                tabStrip.appendChild(newTabButton);

                subTabs.textContent = '';

                if (activeGroup && activeGroup.members.length > 1) {
                    activeGroup.members.forEach((tab) => {
                        subTabs.appendChild(createSubTabChip(tab));
                    });

                    subTabStrip.classList.add('visible');
                } else {
                    subTabStrip.classList.remove('visible');
                }
            }

            function createGroupChip(group) {
                const isActive = group.members.some((tab) => tab.active);

                const representative = group.members.find((tab) => tab.active) || group.members[0];

                const chip = document.createElement('div');

                chip.className = 'tab' + (isActive ? ' active' : '');

                chip.dataset.tooltip =
                    group.key + ' — ' + group.members.length + (group.members.length === 1 ? ' tab' : ' tabs');

                chip.appendChild(createTabIcon(representative));

                const label = document.createElement('span');

                label.className = 'tab-label';

                label.textContent = group.key;

                chip.appendChild(label);

                if (group.members.length > 1) {
                    const count = document.createElement('span');

                    count.className = 'tab-group-count';

                    count.textContent = String(group.members.length);

                    chip.appendChild(count);
                }

                const close = document.createElement('span');

                close.className = 'tab-close';

                close.innerHTML = ICONS.close;

                close.dataset.tooltip =
                    'Close ' + group.members.length + (group.members.length === 1 ? ' Tab' : ' Tabs');

                close.addEventListener('click', (event) => {
                    event.stopPropagation();

                    group.members.forEach((tab) => browserAPI.closeTab(tab.id));
                });

                chip.appendChild(close);

                chip.addEventListener('click', () => {
                    if (!isActive) {
                        browserAPI.selectTab(group.members[0].id);
                    }
                });

                return chip;
            }

            /*
        A member of the active group, listed in the row under the
        strip. Built from the same chip as an ungrouped tab so it picks
        up its click-to-select, close, and hover behaviour for free —
        just smaller, and not draggable, since reordering within a
        group isn't part of what grouping means here.
    */

            function createSubTabChip(tab) {
                const chip = createTabChip(tab);

                chip.draggable = false;

                return chip;
            }

            function tabLabel(tab) {
                if (tab.title) return tab.title;

                try {
                    return new URL(tab.url).hostname.replace(/^www\./, '');
                } catch {
                    return 'New tab';
                }
            }

            function createTabChip(tab) {
                const chip = document.createElement('div');

                chip.className = 'tab' + (tab.active ? ' active' : '') + (tab.suspended ? ' suspended' : '');

                chip.dataset.tooltip = tabLabel(tab) + (tab.url ? '\n' + tab.url : '');

                chip.draggable = true;

                chip.dataset.id = String(tab.id);

                chip.appendChild(createTabIcon(tab));

                const label = document.createElement('span');

                label.className = 'tab-label';

                label.textContent = tabLabel(tab);

                chip.appendChild(label);

                const close = document.createElement('span');

                close.className = 'tab-close';

                close.innerHTML = ICONS.close;

                close.dataset.tooltip = 'Close Tab ' + CLOSE_TAB_SHORTCUT;

                close.addEventListener('click', (event) => {
                    /*
                The tab underneath would otherwise be selected on the
                way out
            */

                    event.stopPropagation();

                    browserAPI.closeTab(tab.id);
                });

                chip.appendChild(close);

                chip.addEventListener('click', () => {
                    if (!tab.active) {
                        browserAPI.selectTab(tab.id);
                    }
                });

                /*
            Middle-clicking a tab closes it, which is how every browser
            with a strip behaves
        */

                chip.addEventListener('auxclick', (event) => {
                    if (event.button !== 1) return;

                    event.preventDefault();

                    browserAPI.closeTab(tab.id);
                });

                chip.addEventListener('dragstart', (event) => {
                    dragTabId = tab.id;

                    event.dataTransfer.effectAllowed = 'move';

                    /*
                The drag has to carry something before dragover fires
            */

                    event.dataTransfer.setData('text/plain', String(tab.id));

                    chip.classList.add('dragging');
                });

                chip.addEventListener('dragend', () => {
                    chip.classList.remove('dragging');

                    hideTabDropIndicator();

                    dragTabId = null;
                });

                return chip;
            }

            function createTabIcon(tab) {
                if (tab.loading) {
                    const spinner = document.createElement('div');

                    spinner.className = 'tab-spinner';

                    return spinner;
                }

                if (!tab.favicon) {
                    return createTabLetterIcon(tab);
                }

                const icon = document.createElement('img');

                icon.className = 'tab-icon';

                icon.src = tab.favicon;

                /*
            A site whose icon has moved or is blocked falls back to the
            lettered square rather than showing a broken image
        */

                icon.addEventListener('error', () => {
                    icon.replaceWith(createTabLetterIcon(tab));
                });

                return icon;
            }

            function createTabLetterIcon(tab) {
                const icon = document.createElement('div');

                icon.className = 'tab-icon tab-letter';

                try {
                    icon.textContent = new URL(tab.url).hostname.replace(/^www\./, '').charAt(0);
                } catch {
                    icon.textContent = (tab.title || '?').charAt(0);
                }

                return icon;
            }

            /*
        The gap the dragged tab would fall into, from which tab centres
        the cursor has passed
    */

            function tabInsertIndexFor(clientX) {
                const chips = tabStrip.querySelectorAll('.tab');

                for (let index = 0; index < chips.length; index += 1) {
                    const box = chips[index].getBoundingClientRect();

                    if (clientX < box.left + box.width / 2) {
                        return index;
                    }
                }

                return chips.length;
            }

            function showTabDropIndicator(index) {
                const chips = tabStrip.querySelectorAll('.tab');

                if (chips.length === 0) return;

                const last = chips[chips.length - 1];

                tabDrop.style.left =
                    index < chips.length
                        ? chips[index].offsetLeft - 2 + 'px'
                        : last.offsetLeft + last.offsetWidth + 'px';

                tabDrop.classList.add('visible');
            }

            function hideTabDropIndicator() {
                tabDrop.classList.remove('visible');

                tabDropIndex = -1;
            }

            tabStrip.addEventListener('dragover', (event) => {
                if (dragTabId === null) return;

                event.preventDefault();

                event.dataTransfer.dropEffect = 'move';

                tabDropIndex = tabInsertIndexFor(event.clientX);

                showTabDropIndicator(tabDropIndex);
            });

            tabStrip.addEventListener('dragleave', (event) => {
                if (event.target === tabStrip) {
                    hideTabDropIndicator();
                }
            });

            tabStrip.addEventListener('drop', (event) => {
                if (dragTabId === null || tabDropIndex === -1) return;

                event.preventDefault();

                const from = tabs.findIndex((tab) => tab.id === dragTabId);

                /*
            Where it lands once it has been lifted out of the strip,
            which is one place to the left when it moves rightwards
        */

                const target = tabDropIndex > from ? tabDropIndex - 1 : tabDropIndex;

                hideTabDropIndicator();

                if (from !== -1 && target !== from) {
                    browserAPI.moveTab(dragTabId, target);
                }
            });

            newTabButton.addEventListener('click', () => {
                browserAPI.newTab();
            });

            groupTabsToggle.addEventListener('click', () => {
                groupedMode = !groupedMode;

                groupTabsToggle.classList.toggle('on', groupedMode);

                groupTabsToggle.dataset.tooltip = groupedMode ? 'Ungroup Tabs' : 'Group Tabs by Site';

                renderTabs({ tabs });
            });

            /*
                The page's own right-click menu asks the real button to
                do this rather than duplicating groupedMode's toggle
                logic itself
            */

            browserAPI.onTriggerGroupTabsToggle(() => {
                groupTabsToggle.click();
            });

            browserAPI.onTabState(renderTabs);

            browserAPI
                .getTabState()
                .then(renderTabs)
                .catch(() => {
                    /*
                Asked before the main process was listening
            */
                });

            /*
        Appearance

        A native radio menu, the same pattern the search engine picker
        uses, rather than a blind click-to-cycle — it also makes "Follow
        System" a real option, not just something you land on in between
        the other two.
    */

            const themeToggle = document.getElementById('theme-toggle');

            const THEME_ICONS = {
                system: ICONS.themeSystem,

                light: ICONS.themeLight,

                dark: ICONS.themeDark
            };

            const THEME_TITLES = {
                system: 'Auto',

                light: 'Light',

                dark: 'Dark'
            };

            function renderTheme(theme) {
                themeToggle.innerHTML = THEME_ICONS[theme] || ICONS.themeSystem;

                themeToggle.dataset.tooltip = THEME_TITLES[theme] || THEME_TITLES.system;
            }

            themeToggle.addEventListener('click', () => {
                browserAPI.showThemeMenu();
            });

            browserAPI.onThemeChange(renderTheme);

            browserAPI
                .getThemeSource()
                .then(renderTheme)
                .catch(() => {
                    /*
                Asked before the main process was listening
            */
                });

            /*
        Maximise
    */

            const maximiseButton = document.getElementById('maximise');

            /*
        The button is not in the bar at the moment, so nothing below it
        in this file would run if it were reached for anyway
    */

            if (maximiseButton) {
                wireMaximiseButton();
            }

            function showMaximised(maximised) {
                maximiseButton.textContent = maximised ? '⤡' : '⤢';

                maximiseButton.title = maximised ? 'Restore window' : 'Maximise window';
            }

            function wireMaximiseButton() {
                maximiseButton.addEventListener('click', () => {
                    browserAPI.toggleMaximise().then(showMaximised);
                });

                /*
            The window can also be maximised from its own title bar, so
            the icon follows the window rather than only its own clicks
        */

                browserAPI.onMaximiseChange(showMaximised);

                browserAPI
                    .isMaximised()
                    .then(showMaximised)
                    .catch(() => {
                        /*
                    Asked before the main process was listening
                */
                    });
            }
        </script>
    </body>
</html>
