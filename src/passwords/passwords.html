<!doctype html>

<html>
    <head>
        <style>
            body {
                box-sizing: border-box;

                margin: 0;

                padding: 20px;

                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

                background: white;

                color: #1d1d1f;
            }

            h1 {
                margin: 0 0 6px;

                font-size: 20px;
            }

            p {
                margin: 0 0 16px;

                color: #666;

                font-size: 13px;
            }

            label {
                display: block;

                margin-bottom: 6px;

                font-size: 12px;

                font-weight: 600;
            }

            input,
            textarea {
                width: 100%;

                font-size: 13px;

                padding: 8px 10px;

                box-sizing: border-box;

                border-radius: 6px;

                border: 1px solid #ccc;
            }

            input {
                height: 34px;
            }

            textarea {
                min-height: 72px;

                resize: vertical;
            }

            .view[hidden] {
                display: none;
            }

            .actions {
                display: flex;

                gap: 8px;

                margin-top: 16px;
            }

            button {
                height: 34px;

                border: none;

                border-radius: 6px;

                background: #007aff;

                color: white;

                font-size: 13px;

                cursor: pointer;

                padding: 0 14px;
            }

            button:hover {
                background: #0066d6;
            }

            button.secondary {
                border: 1px solid #007aff;

                background: white;

                color: #007aff;
            }

            button.secondary:hover {
                background: #f0f6ff;
            }

            button.danger {
                background: #ff3b30;
            }

            button.danger:hover {
                background: #e0352b;
            }

            button.icon {
                width: 34px;

                padding: 0;
            }

            .toolbar {
                display: flex;

                gap: 8px;

                align-items: center;

                margin-bottom: 12px;
            }

            .toolbar input {
                flex: 1;
            }

            .toolbar button {
                flex-shrink: 0;
            }

            #entry-list {
                display: flex;

                flex-direction: column;

                gap: 8px;

                max-height: 320px;

                overflow-y: auto;

                margin-top: 12px;
            }

            .entry {
                display: flex;

                align-items: center;

                gap: 10px;

                padding: 10px 12px;

                border: 1px solid #e5e5ea;

                border-radius: 8px;

                background: #fafafa;
            }

            .entry-main {
                flex: 1;

                min-width: 0;
            }

            .entry-title {
                font-size: 14px;

                font-weight: 600;

                white-space: nowrap;

                overflow: hidden;

                text-overflow: ellipsis;
            }

            .entry-meta {
                margin-top: 2px;

                font-size: 12px;

                color: #666;

                white-space: nowrap;

                overflow: hidden;

                text-overflow: ellipsis;
            }

            .entry-actions {
                display: flex;

                gap: 4px;

                flex-shrink: 0;
            }

            #empty-state {
                padding: 24px 12px;

                text-align: center;

                color: #888;

                font-size: 13px;
            }

            .error {
                margin-top: 10px;

                color: #ff3b30;

                font-size: 12px;
            }

            .form-grid {
                display: flex;

                flex-direction: column;

                gap: 12px;
            }

            .password-row {
                display: flex;

                gap: 8px;
            }

            .password-row input {
                flex: 1;
            }

            .header-row {
                display: flex;

                justify-content: space-between;

                align-items: center;

                margin-bottom: 8px;
            }
        </style>
    </head>

    <body>
        <div id="setup-view" class="view" hidden>
            <h1>Create master password</h1>

            <p>
                Your passwords are encrypted with this master password. WebDesk cannot recover it if
                you forget it.
            </p>

            <form id="setup-form" class="form-grid">
                <div>
                    <label for="setup-password">Master password</label>

                    <input id="setup-password" type="password" autocomplete="new-password" />
                </div>

                <div>
                    <label for="setup-confirm">Confirm master password</label>

                    <input id="setup-confirm" type="password" autocomplete="new-password" />
                </div>

                <div id="setup-error" class="error" hidden></div>

                <div class="actions">
                    <button type="submit">Create vault</button>
                </div>
            </form>
        </div>

        <div id="unlock-view" class="view" hidden>
            <h1>Unlock passwords</h1>

            <p>Enter your master password to view and manage saved passwords.</p>

            <form id="unlock-form" class="form-grid">
                <div>
                    <label for="unlock-password">Master password</label>

                    <input id="unlock-password" type="password" autocomplete="current-password" />
                </div>

                <div id="unlock-error" class="error" hidden></div>

                <div class="actions">
                    <button type="submit">Unlock</button>
                </div>
            </form>
        </div>

        <div id="list-view" class="view" hidden>
            <div class="header-row">
                <h1>Passwords</h1>

                <button id="lock-button" class="secondary" type="button">Lock</button>
            </div>

            <div class="toolbar">
                <input id="search" placeholder="Search passwords…" />

                <button id="add-button" type="button">Add</button>
            </div>

            <div id="entry-list"></div>

            <div id="empty-state" hidden>No saved passwords yet.</div>
        </div>

        <div id="form-view" class="view" hidden>
            <h1 id="form-heading">Add password</h1>

            <form id="entry-form" class="form-grid">
                <div>
                    <label for="entry-title">Title</label>

                    <input id="entry-title" placeholder="GitHub" />
                </div>

                <div>
                    <label for="entry-url">Website URL</label>

                    <input id="entry-url" placeholder="https://github.com" />
                </div>

                <div>
                    <label for="entry-username">Username or email</label>

                    <input
                        id="entry-username"
                        placeholder="you@example.com"
                        autocomplete="username"
                    />
                </div>

                <div>
                    <label for="entry-password">Password</label>

                    <div class="password-row">
                        <input id="entry-password" type="password" autocomplete="new-password" />

                        <button
                            id="toggle-password"
                            class="secondary icon"
                            type="button"
                            title="Show password"
                        >
                            👁
                        </button>

                        <button id="generate-password" class="secondary" type="button">
                            Generate
                        </button>
                    </div>
                </div>

                <div id="form-error" class="error" hidden></div>

                <div class="actions">
                    <button id="save-entry" type="submit">Save</button>

                    <button id="cancel-entry" class="secondary" type="button">Cancel</button>

                    <button id="delete-entry" class="danger" type="button" hidden>Delete</button>
                </div>
            </form>
        </div>

        <script>
            const setupView = document.getElementById('setup-view');

            const unlockView = document.getElementById('unlock-view');

            const listView = document.getElementById('list-view');

            const formView = document.getElementById('form-view');

            const entryList = document.getElementById('entry-list');

            const emptyState = document.getElementById('empty-state');

            const searchInput = document.getElementById('search');

            let entries = [];

            let editingId = null;

            let pageConfig = { currentPageUrl: '', currentPageTitle: '' };

            function showView(view) {
                [setupView, unlockView, listView, formView].forEach((element) => {
                    element.hidden = element !== view;
                });
            }

            function showError(element, message) {
                if (!message) {
                    element.hidden = true;

                    element.textContent = '';

                    return;
                }

                element.hidden = false;

                element.textContent = message;
            }

            function renderEntries() {
                const query = searchInput.value.trim().toLowerCase();

                const filtered = entries.filter((entry) => {
                    if (!query) return true;

                    const haystack = [entry.title, entry.url, entry.username]
                        .join(' ')
                        .toLowerCase();

                    return haystack.includes(query);
                });

                entryList.textContent = '';

                emptyState.hidden = filtered.length !== 0;

                filtered.forEach((entry) => {
                    entryList.appendChild(createEntryRow(entry));
                });
            }

            function createEntryRow(entry) {
                const row = document.createElement('div');

                row.className = 'entry';

                const main = document.createElement('div');

                main.className = 'entry-main';

                const title = document.createElement('div');

                title.className = 'entry-title';

                title.textContent = entry.title;

                const meta = document.createElement('div');

                meta.className = 'entry-meta';

                meta.textContent = entry.username ? entry.username + ' · ' + entry.url : entry.url;

                main.appendChild(title);

                main.appendChild(meta);

                const actions = document.createElement('div');

                actions.className = 'entry-actions';

                const copyButton = document.createElement('button');

                copyButton.className = 'secondary icon';

                copyButton.type = 'button';

                copyButton.title = 'Copy password';

                copyButton.textContent = '⎘';

                copyButton.addEventListener('click', async () => {
                    const result = await window.browserAPI.copyPassword(entry.id);

                    if (!result || !result.ok) {
                        alert(result && result.error ? result.error : 'Could not copy password');

                        return;
                    }

                    copyButton.textContent = '✓';

                    setTimeout(() => {
                        copyButton.textContent = '⎘';
                    }, 1200);
                });

                const editButton = document.createElement('button');

                editButton.className = 'secondary icon';

                editButton.type = 'button';

                editButton.title = 'Edit';

                editButton.textContent = '✎';

                editButton.addEventListener('click', () => openForm(entry));

                const deleteButton = document.createElement('button');

                deleteButton.className = 'danger icon';

                deleteButton.type = 'button';

                deleteButton.title = 'Delete';

                deleteButton.textContent = '🗑';

                deleteButton.addEventListener('click', () => deletePasswordEntry(entry.id));

                actions.appendChild(copyButton);

                actions.appendChild(editButton);

                actions.appendChild(deleteButton);

                row.appendChild(main);

                row.appendChild(actions);

                return row;
            }

            async function deletePasswordEntry(id) {
                if (!id) return;

                if (!confirm('Delete this saved password?')) return;

                const result = await window.browserAPI.deletePassword(id);

                if (!result || !result.ok) {
                    alert(result && result.error ? result.error : 'Could not delete password');

                    return;
                }

                if (editingId === id) {
                    showView(listView);
                }

                await refreshState();
            }

            async function refreshState() {
                if (
                    !window.browserAPI ||
                    typeof window.browserAPI.getPasswordState !== 'function'
                ) {
                    entries = [];

                    showView(listView);

                    renderEntries();

                    return;
                }

                const state = await window.browserAPI.getPasswordState();

                if (!state.setup) {
                    showView(setupView);

                    return;
                }

                if (!state.unlocked) {
                    showView(unlockView);

                    return;
                }

                entries = Array.isArray(state.entries) ? state.entries : [];

                showView(listView);

                renderEntries();
            }

            function openForm(entry) {
                editingId = entry ? entry.id : null;

                document.getElementById('form-heading').textContent = entry
                    ? 'Edit password'
                    : 'Add password';

                document.getElementById('entry-title').value = entry
                    ? entry.title
                    : pageConfig.currentPageTitle || '';

                document.getElementById('entry-url').value = entry
                    ? entry.url
                    : pageConfig.currentPageUrl || '';

                document.getElementById('entry-username').value = entry ? entry.username : '';

                document.getElementById('entry-password').value = entry ? entry.password || '' : '';

                document.getElementById('delete-entry').hidden = !entry;

                showError(document.getElementById('form-error'), '');

                showView(formView);

                document.getElementById('entry-title').focus();
            }

            function generatePassword() {
                const chars =
                    'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+';

                let password = '';

                const random = crypto.getRandomValues(new Uint32Array(16));

                for (let index = 0; index < 16; index += 1) {
                    password += chars[random[index] % chars.length];
                }

                document.getElementById('entry-password').value = password;
            }

            document.getElementById('setup-form').addEventListener('submit', async (event) => {
                event.preventDefault();

                const password = document.getElementById('setup-password').value;

                const confirm = document.getElementById('setup-confirm').value;

                const errorElement = document.getElementById('setup-error');

                if (password !== confirm) {
                    showError(errorElement, 'Passwords do not match');

                    return;
                }

                const result = await window.browserAPI.setupPasswordVault(password);

                if (!result || !result.ok) {
                    showError(
                        errorElement,
                        result && result.error ? result.error : 'Could not create vault'
                    );

                    return;
                }

                showError(errorElement, '');

                await refreshState();
            });

            document.getElementById('unlock-form').addEventListener('submit', async (event) => {
                event.preventDefault();

                const password = document.getElementById('unlock-password').value;

                const errorElement = document.getElementById('unlock-error');

                const result = await window.browserAPI.unlockPasswordVault(password);

                if (!result || !result.ok) {
                    showError(
                        errorElement,
                        result && result.error ? result.error : 'Could not unlock vault'
                    );

                    return;
                }

                showError(errorElement, '');

                document.getElementById('unlock-password').value = '';

                entries = [];

                showView(listView);

                renderEntries();

                await refreshState();
            });

            document.getElementById('lock-button').addEventListener('click', async () => {
                await window.browserAPI.lockPasswordVault();

                await refreshState();
            });

            document.getElementById('add-button').addEventListener('click', () => openForm(null));

            searchInput.addEventListener('input', renderEntries);

            document.getElementById('cancel-entry').addEventListener('click', () => {
                showView(listView);
            });

            document.getElementById('toggle-password').addEventListener('click', () => {
                const input = document.getElementById('entry-password');

                input.type = input.type === 'password' ? 'text' : 'password';
            });

            document
                .getElementById('generate-password')
                .addEventListener('click', generatePassword);

            document.getElementById('entry-form').addEventListener('submit', async (event) => {
                event.preventDefault();

                const payload = {
                    title: document.getElementById('entry-title').value,
                    url: document.getElementById('entry-url').value,
                    username: document.getElementById('entry-username').value,
                    password: document.getElementById('entry-password').value
                };

                const errorElement = document.getElementById('form-error');

                const result = editingId
                    ? await window.browserAPI.updatePassword(editingId, payload)
                    : await window.browserAPI.addPassword(payload);

                if (!result || !result.ok) {
                    showError(
                        errorElement,
                        result && result.error ? result.error : 'Could not save password'
                    );

                    return;
                }

                showError(errorElement, '');

                entries = [];

                showView(listView);

                renderEntries();

                await refreshState();
            });

            document.getElementById('delete-entry').addEventListener('click', () => {
                deletePasswordEntry(editingId);
            });

            window.browserAPI.onPasswordConfig((config) => {
                pageConfig = config || pageConfig;
            });

            refreshState().catch(() => {
                showView(setupView);
            });
        </script>
    </body>
</html>
